<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VDB MUSIC v61 — DEMO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --cor-1:#2563eb;
  --cor-2:#1e40af;
  --cor-3:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;
  font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
input,textarea{user-select:text!important;-webkit-user-select:text!important}
html,body{height:100dvh;width:100%;background:#000;overflow:hidden;position:fixed;top:0;left:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--cor-1);border-radius:4px}

/* ═══ LOADING ═══ */
#loadingScreen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,var(--cor-2),var(--cor-1));
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;
  transition:opacity .5s;
}
#loadingScreen.hide{opacity:0;pointer-events:none}
.loading-logo{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,var(--cor-1),var(--cor-3));
  display:flex;align-items:center;justify-content:center;font-size:2.5rem;
  animation:pulse 2s ease-in-out infinite;box-shadow:0 0 50px rgba(255,255,255,.4)
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.loading-text{font-family:'Audiowide';font-size:1.5rem;color:#fff;letter-spacing:5px}
.loading-sub{font-size:.7rem;color:rgba(255,255,255,.8);letter-spacing:6px}
.loading-bar{width:220px;height:4px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden}
.loading-fill{height:100%;width:0;background:#fff;transition:width .3s;border-radius:4px}

/* ═══ APP ═══ */
#app{position:fixed;inset:0;display:none}
#app.visible{display:block}

.media-bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#000}
.media-bg video,.media-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
.media-bg .active{opacity:1;z-index:2}
.media-bg .fallback{
  position:absolute;inset:0;z-index:1;opacity:1;
  background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
  background-size:400% 400%;animation:gradientMove 15s ease infinite;
}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* ═══ TOPO ═══ */
.info-topo{
  position:fixed;top:0;left:0;right:0;z-index:30;
  padding-top:max(10px,var(--safe-top));padding-bottom:12px;
  background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);
  display:flex;flex-direction:column;gap:4px;
  transition:opacity .5s,transform .5s;pointer-events:none;
}
.info-topo > *{pointer-events:auto}
.info-topo.escondido{opacity:0;transform:translateY(-10px);pointer-events:none}
.topo-linha{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:32px;gap:8px}
.timer-topo{font-size:.72rem;font-weight:800;color:#fff;min-width:60px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.titulo-topo{
  font-family:'Audiowide';font-size:1.1rem;font-weight:900;letter-spacing:5px;color:#fff;
  text-shadow:0 0 12px rgba(255,255,255,.5),0 0 24px var(--cor-3);
  flex:1;text-align:center;cursor:pointer;
}
.menu-btn{
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:50%;
  color:#fff;width:32px;height:32px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
}
.letreiro-wrap{height:36px;padding:0 16px;overflow:hidden;display:flex;align-items:center;cursor:pointer}
.letreiro{
  font-size:.95rem;font-weight:800;color:#fff;white-space:nowrap;
  animation:scroll 60s linear infinite;text-shadow:0 1px 4px rgba(0,0,0,.7);
}
@keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}

/* ═══ PAINEL BAIXO ═══ */
.painel-baixo{
  position:absolute;left:0;right:0;bottom:80px;z-index:20;
  padding:16px 20px calc(12px + var(--safe-bottom));
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));
  text-align:center;display:flex;flex-direction:column;gap:10px;
  transition:opacity .5s,transform .5s;pointer-events:none;
}
.painel-baixo > *{pointer-events:auto}
.painel-baixo.escondido{opacity:0;transform:translateY(20px);pointer-events:none}

.btn-coracao{
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);
  border-radius:50%;width:44px;height:44px;color:#fff;font-size:1.3rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  margin:0 auto;backdrop-filter:blur(6px);transition:transform .2s,background .2s;
}
.btn-coracao:active{transform:scale(.88)}
.btn-coracao.ativo{color:#f472b6;background:rgba(244,114,182,.25);border-color:#f472b6}

.label-musica{font-size:.62rem;font-weight:800;letter-spacing:4px;color:rgba(255,255,255,.7);text-transform:uppercase}
.label-musica.fav{color:#ffb0d0}
.nome-musica{
  font-size:1.05rem;font-weight:800;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;
}
.artista-musica{
  font-size:.7rem;font-weight:600;color:rgba(255,255,255,.85);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.controles{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:4px}
.ctrl-btn{
  background:transparent;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:8px;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.7));transition:transform .15s;
}
.ctrl-btn:active{transform:scale(.85)}
.play-big{font-size:1.9rem}
.play-big.loading i{animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}

.progresso{padding:4px 4px 0}
.tempo{display:flex;justify-content:space-between;font-size:.66rem;font-weight:700;color:rgba(255,255,255,.85);margin-bottom:6px}
.progress-bar{height:4px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;cursor:pointer;touch-action:none}
.progress-fill{height:100%;width:0;background:#fff;border-radius:4px;transition:width .2s linear}

/* ═══ BARRA INFERIOR VIDRO ═══ */
.barra-inferior{
  position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bottom));z-index:25;
  display:flex;align-items:center;justify-content:space-around;gap:6px;
  padding:8px 10px;
  background:rgba(15,20,35,.55);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  box-shadow:0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
  transition:opacity .5s,transform .5s;
}
.barra-inferior.escondida{opacity:0;transform:translateY(20px);pointer-events:none}
.barra-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;background:transparent;border:none;color:#fff;
  font-size:.6rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  cursor:pointer;border-radius:14px;transition:background .2s,transform .15s;
  position:relative;
}
.barra-btn:active{transform:scale(.92);background:rgba(255,255,255,.12)}
.barra-btn i{font-size:1.15rem}
.barra-btn.fav i{color:#f472b6}
.badge{
  position:absolute;top:2px;right:8px;
  background:#f472b6;color:#fff;font-size:.55rem;font-weight:900;
  padding:1px 5px;border-radius:8px;min-width:16px;text-align:center;
}

/* ═══ ANÚNCIOS (SEM BOTÕES) ═══ */
#telaAnuncios{
  position:fixed;inset:0;z-index:8;background:#000;
  opacity:0;visibility:hidden;transition:opacity .6s;
}
#telaAnuncios.ativa{opacity:1;visibility:visible}
.media-anuncios{position:absolute;inset:0;overflow:hidden}
.media-anuncios video,.media-anuncios img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
.media-anuncios .active{opacity:1}

/* ═══ MENU "+" EM ABAS (E3) ═══ */
.fab-container{
  position:fixed;bottom:calc(90px + var(--safe-bottom));right:16px;z-index:50;
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  transition:opacity .5s;
}
.fab-container.escondido{opacity:0;pointer-events:none}
.fab-main{
  background:linear-gradient(135deg,var(--cor-1),var(--cor-3));
  border:none;border-radius:50%;color:#fff;font-size:1.3rem;
  width:48px;height:48px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .2s;
}
.fab-main:active{transform:scale(.9)}
.fab-main i{transition:transform .3s}
.fab-main.open i{transform:rotate(45deg)}

.fab-menu{
  background:rgba(15,20,35,.97);
  backdrop-filter:blur(30px);
  border-radius:20px;padding:10px;display:none;
  flex-direction:column;gap:8px;
  border:1px solid rgba(255,255,255,.15);
  min-width:240px;
  box-shadow:0 12px 40px rgba(0,0,0,.85);
  animation:fadeInUp .3s;
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fab-menu.open{display:flex}

.fab-aba{
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:14px 16px;color:#fff;
  font-size:.85rem;font-weight:800;letter-spacing:1px;
  cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:background .2s,transform .15s;text-align:left;
}
.fab-aba:active{transform:scale(.97);background:rgba(255,255,255,.12)}
.fab-aba i.aba-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;
}
.fab-aba .aba-arrow{margin-left:auto;opacity:.5;font-size:.8rem}
.aba-repro i.aba-icon{background:linear-gradient(135deg,#f59e0b,#f97316)}
.aba-off i.aba-icon{background:linear-gradient(135deg,#10b981,#059669)}
.aba-app i.aba-icon{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.aba-conta i.aba-icon{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}

.fab-submenu{display:none;flex-direction:column;gap:4px;padding:4px 0;animation:fadeInUp .25s}
.fab-submenu.open{display:flex}
.fab-sub-btn{
  background:transparent;border:none;color:#e8e4f5;
  padding:11px 14px;border-radius:10px;
  font-size:.82rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:12px;text-align:left;
}
.fab-sub-btn:active{background:rgba(255,255,255,.1)}
.fab-sub-btn i{width:20px;text-align:center;font-size:.95rem}
.fab-voltar{
  background:rgba(255,255,255,.06);border:none;color:#aaa;
  padding:8px 14px;border-radius:10px;font-size:.75rem;font-weight:800;
  cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;
  margin-top:4px;
}

/* ═══ MODAIS ═══ */
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{
  background:linear-gradient(145deg,rgba(20,25,40,.98),rgba(10,15,30,.98));
  border-radius:24px;padding:20px;width:100%;max-width:460px;
  max-height:85vh;overflow:hidden;display:flex;flex-direction:column;gap:12px;
  border:1px solid rgba(255,255,255,.15);
}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.modal-header .titulo{font-family:'Audiowide';font-size:.95rem;color:#fff;letter-spacing:3px}
.modal-header .fechar{background:transparent;border:none;color:#aaa;font-size:1.2rem;cursor:pointer}

.search-input{
  width:100%;padding:14px 18px;border-radius:30px;
  border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
  color:#fff;font-size:.95rem;outline:none;
}
.search-input:focus{border-color:var(--cor-3);box-shadow:0 0 20px rgba(59,130,246,.4)}
.search-filters{display:flex;gap:8px}
.search-filters select{
  flex:1;padding:11px 14px;border-radius:14px;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
  color:#fff;font-size:.8rem;font-weight:700;outline:none;cursor:pointer;
}
.search-filters select option{background:#1a1a2e;color:#fff}
.search-count{font-size:.72rem;color:rgba(255,255,255,.6);font-weight:700;text-align:center}
.search-results{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;max-height:45vh}
.result-item{
  padding:11px 14px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;cursor:pointer;
}
.result-item:active{background:rgba(255,255,255,.12)}
.result-item .icon{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--cor-1),var(--cor-3));
  display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;
  flex-shrink:0;
}
.result-item .info{flex:1;min-width:0;overflow:hidden}
.result-item .title{color:#fff;font-weight:700;font-size:.88rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.result-item .artist{color:rgba(255,255,255,.6);font-size:.72rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.result-item .genero{
  font-size:.62rem;color:var(--cor-3);font-weight:800;
  padding:4px 9px;background:rgba(59,130,246,.15);border-radius:10px;flex-shrink:0;
}

/* ═══ GÊNEROS COM BAIXAR (D2) ═══ */
.genres-grid{display:grid;grid-template-columns:1fr;gap:10px;flex:1;overflow-y:auto;padding-right:4px}
.genre-card{
  position:relative;border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;
}
.genre-top{
  padding:14px 16px 12px 22px;display:flex;align-items:center;
  cursor:pointer;position:relative;transition:background .15s;
}
.genre-top:active{background:rgba(255,255,255,.08)}
.genre-top::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:55%;background:var(--c1,var(--cor-3));
  border-radius:0 4px 4px 0;box-shadow:0 0 10px var(--c1,var(--cor-3));
}
.genre-name{font-size:1.05rem;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:#fff}
.genre-status{position:absolute;top:8px;right:12px;font-size:.75rem}
.genre-footer{
  border-top:1px solid rgba(255,255,255,.08);
  padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(0,0,0,.2);cursor:pointer;
  font-size:.75rem;font-weight:800;color:#fbbf24;
  transition:background .15s;
}
.genre-footer:active{background:rgba(251,191,36,.1)}
.genre-footer.offline{color:#10b981}
.genre-footer.remover{color:#ef4444}
.genre-footer.baixando{color:#3b82f6}

/* ═══ FAVORITAS ═══ */
.fav-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:50vh}
.fav-item{
  padding:11px 14px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.fav-item .info{flex:1;min-width:0}
.fav-item .title{color:#fff;font-weight:700;font-size:.88rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fav-item .artist{color:rgba(255,255,255,.55);font-size:.72rem;display:block}
.fav-item .remove{background:transparent;border:none;color:#f472b6;font-size:1.1rem;cursor:pointer}

/* ═══ DOWNLOAD MODAL ═══ */
.dl-bar{height:10px;background:rgba(0,0,0,.55);border-radius:10px;overflow:hidden;margin:12px 0}
.dl-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cor-1),var(--cor-3));
  border-radius:10px;transition:width .3s}
.dl-info{display:flex;justify-content:space-between;font-size:.78rem;color:rgba(255,255,255,.7);margin-bottom:12px}

/* ═══ NOTIFICAÇÃO ═══ */
.notif{
  position:fixed;top:calc(100px + var(--safe-top));left:50%;transform:translateX(-50%);
  background:rgba(15,20,30,.95);backdrop-filter:blur(20px);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:.78rem;font-weight:700;
  z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;
  border:1px solid rgba(255,255,255,.15);max-width:calc(100vw - 40px);text-align:center;
}
.notif.show{opacity:1}

/* ═══ FALLBACK MÍDIA ═══ */
.media-fallback{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
  background-size:400% 400%;animation:gradientMove 15s ease infinite;
  display:flex;align-items:center;justify-content:center;
  font-family:'Audiowide';font-size:1.8rem;color:rgba(255,255,255,.15);
  letter-spacing:10px;
}

@media(max-width:400px){
  .barra-btn span{font-size:.55rem}
  .nome-musica{font-size:.95rem}
  .fab-menu{min-width:200px}
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="loading-logo">🎵</div>
  <div class="loading-text">VDB</div>
  <div class="loading-sub">CARREGANDO</div>
  <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
</div>

<!-- APP -->
<div id="app">
  <!-- MÍDIA DE FUNDO -->
  <div class="media-bg" id="mediaBg">
    <div class="media-fallback">VDB MUSIC</div>
  </div>

  <!-- TOPO -->
  <div class="info-topo" id="infoTopo">
    <div class="topo-linha">
      <span class="timer-topo"><i class="fas fa-clock"></i> VITALÍCIO</span>
      <div class="titulo-topo" id="tituloTopo">VDB</div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><i class="fas fa-ellipsis-v"></i></button>
    </div>
    <div class="letreiro-wrap" id="letreiroClick">
      <p class="letreiro" id="letreiro">🎵 VDB MUSIC • SERTANEJO • MPB • ROCK • FORRÓ • PAGODE 🎶</p>
    </div>
  </div>

  <!-- PAINEL BAIXO -->
  <div class="painel-baixo" id="painelBaixo">
    <button class="btn-coracao" id="btnCoracao" aria-label="Favoritar"><i class="far fa-heart"></i></button>
    <div class="label-musica" id="labelMusica">TOCANDO AGORA</div>
    <div class="nome-musica" id="nomeMusica">Escolha um gênero</div>
    <div class="artista-musica" id="artistaMusica">VDB MUSIC</div>
    <div class="controles">
      <button class="ctrl-btn" id="prevBtn" aria-label="Anterior"><i class="fas fa-backward-step"></i></button>
      <button class="ctrl-btn play-big" id="playBtn" aria-label="Play"><i class="fas fa-play"></i></button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Próxima"><i class="fas fa-forward-step"></i></button>
    </div>
    <div class="progresso">
      <div class="tempo"><span id="tempoAtual">0:00</span><span id="tempoTotal">0:00</span></div>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <!-- BARRA INFERIOR VIDRO -->
  <div class="barra-inferior" id="barraInferior">
    <button class="barra-btn" id="barraBuscar"><i class="fas fa-magnifying-glass"></i><span>Buscar</span></button>
    <button class="barra-btn fav" id="barraFavoritas">
      <i class="fas fa-heart"></i><span>Favoritas</span>
      <span class="badge" id="badgeFav" style="display:none">0</span>
    </button>
    <button class="barra-btn" id="barraGeneros"><i class="fas fa-guitar"></i><span>Gêneros</span></button>
  </div>

  <!-- FAB MENU EM ABAS -->
  <div class="fab-container" id="fabContainer">
    <div class="fab-menu" id="fabMenu">
      <div id="fabAbaPrincipal">
        <button class="fab-aba aba-repro" data-aba="repro">

const fmt = s => { if(!s||isNaN(s))return '0:00'; const m=Math.floor(s/60),sg=Math.floor(s%60); return m+':'+(sg<10?'0':'')+sg; };
const vibrar = p => { try{ navigator.vibrate && navigator.vibrate(p||15); }catch(e){} };
const sanitize = t => { if(!t)return ''; const d=document.createElement('div'); d.textContent=t; return d.textContent; };
function shuffle(a){
  if(!a||!a.length) return [];
  const x = [...a];
  for(let i = x.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [x[i],x[j]] = [x[j],x[i]];
  }
  return x;
}

try{ app.favoritos = JSON.parse(localStorage.getItem('vdb_demo_fav')||'[]'); }catch(e){}

// Offline meta
function getOfflineMeta(){ try{ return JSON.parse(localStorage.getItem('vdb_demo_offline')||'{}'); }catch(e){ return {}; } }
function setOfflineMeta(m){ try{ localStorage.setItem('vdb_demo_offline', JSON.stringify(m)); }catch(e){} }
function generoOffline(g){ const m = getOfflineMeta(); return !!(m[g] && m[g].completo); }

// ═══════════════════════════════════════════════════════
// OFFLINE — CACHE API COM URL LIMPA (CORREÇÃO PRINCIPAL)
// ═══════════════════════════════════════════════════════
const CACHE_NAME = 'vdb-demo-offline-v1';

async function abrirCache(){
  if(!('caches' in window)) return null;
  try{ return await caches.open(CACHE_NAME); }catch(e){ return null; }
}

// ✅ URL LIMPA (sem cache-bust) pra bater sempre
function urlLimpa(url){
  try{
    const u = new URL(url);
    u.searchParams.delete('v');
    u.searchParams.delete('t');
    return u.toString();
  }catch(e){ return url.split('?')[0]; }
}

async function estaOffline(url){
  if(!url) return false;
  const c = await abrirCache();
  if(!c) return false;
  try{
    const r = await c.match(urlLimpa(url));
    return !!r;
  }catch(e){ return false; }
}

async function salvarOffline(url, timeoutMs=25000){
  if(!url || !url.startsWith('http')) return false;
  const c = await abrirCache();
  if(!c) return false;
  const limpa = urlLimpa(url);
  try{
    if(await c.match(limpa)) return true;
    const ctrl = new AbortController();
    const tid = setTimeout(()=>ctrl.abort(), timeoutMs);
    const r = await fetch(url, { mode:'cors', signal: ctrl.signal });
    clearTimeout(tid);
    if(!r.ok) return false;
    // Salva com URL LIMPA (não com cache-bust!)
    await c.put(limpa, r.clone());
    return true;
  }catch(e){ return false; }
}

async function buscarAudioOffline(url){
  const c = await abrirCache();
  if(!c) return null;
  try{
    const r = await c.match(urlLimpa(url));
    if(!r) return null;
    const b = await r.blob();
    return URL.createObjectURL(b);
  }catch(e){ return null; }
}

async function limparOfflineGenero(genero){
  const c = await abrirCache();
  if(!c) return;
  const keys = await c.keys();
  const meta = getOfflineMeta();
  const info = meta[genero];
  if(!info) return;
  // Não temos como saber quais URLs exatas, então limpamos por prefixo do repo
  const repo = GENRE_REPOS[genero] || '';
  for(const k of keys){
    if(repo && k.url.includes(repo)) await c.delete(k);
  }
  delete meta[genero];
  setOfflineMeta(meta);
}

async function limparTodoOffline(){
  try{
    const c = await abrirCache();
    if(c){ const ks = await c.keys(); for(const k of ks) await c.delete(k); }
    setOfflineMeta({});
  }catch(e){}
}

// ═══════════════════════════════════════════════════════
// URLs DE MÚSICA
// ═══════════════════════════════════════════════════════
function getUrls(m){
  const s = m.src || '';
  if(!s) return [];
  if(s.startsWith('http')){
    // ✅ SEM cache-bust aqui também (a URL limpa é o que importa)
    return [s];
  }
  const nome = s.replace(/^\.\//,'').replace(/[^a-zA-Z0-9\-_.]/g,'');
  if(!nome) return [];
  const repo = GENRE_REPOS[m.genero] || 'radiolojasjc-hub/play12';
  return ['https://raw.githubusercontent.com/' + repo + '/refs/heads/main/' + nome];
}

// ═══════════════════════════════════════════════════════
// CACHE DE GÊNERO (JSON)
// ═══════════════════════════════════════════════════════
const cacheGeneroMem = new Map();
async function buscarGenero(genero){
  if(cacheGeneroMem.has(genero)) return cacheGeneroMem.get(genero);
  const url = GENRE_URLS[genero];
  if(!url) return null;
  try{
    const r = await fetch(url + '?v=' + CONFIG.APP_VERSION);
    if(!r.ok) throw new Error('HTTP');
    let j = await r.json();
    if(!Array.isArray(j)) j = j.musicas || j.data || Object.values(j)[0];
    const ms = (j||[]).filter(m=>m&&m.src&&m.title).map(m=>({
      ...m,
      id: 'fav_' + (m.title+'_'+(m.artist||'Artista')).toLowerCase().replace(/[^a-z0-9]+/g,'_'),
      genero,
      artist: m.artist || 'Artista'
    }));
    cacheGeneroMem.set(genero, ms);
    return ms;
  }catch(e){
    // tenta cache local
    try{
      const c = await abrirCache();
      if(c){
        const r2 = await c.match(url);
        if(r2){ const d = await r2.json(); return d; }
      }
    }catch(e2){}
    return null;
  }
}

// ═══════════════════════════════════════════════════════
// PLAYER
// ═══════════════════════════════════════════════════════
const audio = new Audio();
audio.preload = 'none';

function atualizarPlaylist(){
  if(!app.musicas.length) return null;
  if(!app.playlistAtual.length){
    app.playlistAtual = shuffle(app.musicas);
    app.indiceAtual = 0;
  }
  if(app.indiceAtual >= app.playlistAtual.length){
    let lista = app.musicas;
    if(app.musicasComProblema.size > 0 && app.musicasComProblema.size < app.musicas.length * 0.9){
      lista = app.musicas.filter(m => !app.musicasComProblema.has(m.id));
      if(lista.length < 10){ app.musicasComProblema.clear(); lista = app.musicas; }
    } else if(app.musicasComProblema.size >= app.musicas.length * 0.9){
      app.musicasComProblema.clear();
    }
    app.playlistAtual = shuffle(lista);
    app.indiceAtual = 0;
  }
  return app.playlistAtual[app.indiceAtual] || null;
}

async function tocar(){
  if(app.carregando || !app.musicas.length) return;
  app.carregando = true;
  try{
    $('playBtn').innerHTML = '<i class="fas fa-spinner"></i>';
    $('playBtn').classList.add('loading');

    const m = atualizarPlaylist();
    if(!m){ app.carregando = false; return; }

    atualizarLetreiro(m);
    atualizarInfoMusica(m);
    atualizarCoracao();

    // MediaSession
    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.metadata = new MediaMetadata({
          title: m.title||'VDB', artist: m.artist||'Artista',
          album: m.genero||'Música'
        });
      }catch(e){}
    }

    const urls = getUrls(m);
    let ok = false;

    // 1) Tenta offline primeiro
    for(const u of urls){
      const off = await buscarAudioOffline(u);
      if(off){
        try{
          audio.src = off;
          audio.load();
          await sleep(200);
          ok = true;
          break;
        }catch(e){}
      }
    }

    // 2) Tenta online
    if(!ok){
      for(const u of urls){
        try{
          const car = await new Promise(r=>{
            const t = setTimeout(()=>{ audio.oncanplay=null; audio.onerror=null; r(false); }, 8000);
            audio.oncanplay = ()=>{ clearTimeout(t); audio.oncanplay=null; audio.onerror=null; r(true); };
            audio.onerror = ()=>{ clearTimeout(t); audio.oncanplay=null; audio.onerror=null; r(false); };
            audio.src = u;
            audio.load();
          });
          if(car){ ok = true; break; }
        }catch(e){}
      }
    }

    if(ok){
      try{
        audio.volume = 0;
        await audio.play();
        // fade in
        let v = 0;
        const fi = setInterval(()=>{
          v += 0.1;
          if(v >= 1){ audio.volume = 1; clearInterval(fi); }
          else audio.volume = v;
        }, 60);
        app.isPlaying = true;
        $('playBtn').classList.remove('loading');
        $('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
      }catch(e){
        $('playBtn').classList.remove('loading');
        $('playBtn').innerHTML = '<i class="fas fa-play"></i>';
        setTimeout(next, 200);
      }
    }else{
      // Música ruim — marca e pula
      app.musicasComProblema.add(m.id);
      $('playBtn').classList.remove('loading');
      $('playBtn').innerHTML = '<i class="fas fa-play"></i>';
      setTimeout(next, 200);
    }
  }catch(e){
    console.error('Erro tocar:', e);
  }finally{
    app.carregando = false;
    $('playBtn').classList.remove('loading');
  }
}

function togglePlay(){
  vibrar();
  if(!app.playerAtivado){ notif('🔊 Toque pra ativar'); return; }
  if(audio.paused) tocar();
  else{
    audio.pause();
    app.isPlaying = false;
    $('playBtn').innerHTML = '<i class="fas fa-play"></i>';
  }
}

function next(){
  vibrar();
  if(app.carregando) return;
  if(!app.playlistAtual.length && !app.musicas.length) return;
  app.indiceAtual++;
  atualizarPlaylist();
  if(app.playerAtivado) setTimeout(tocar, 80);
}

function prev(){
  vibrar();
  if(app.carregando) return;
  if(!app.playlistAtual.length) return;
  app.indiceAtual = (app.indiceAtual - 1 + app.playlistAtual.length) % app.playlistAtual.length;
  if(app.playerAtivado) setTimeout(tocar, 80);
}

// Eventos
audio.addEventListener('ended', ()=>{ if(!app.carregando) setTimeout(next, 150); });
audio.addEventListener('error', ()=>{
  if(app.carregando) return;
  if(!audio.src || audio.src === location.href) return;
  const m = app.playlistAtual[app.indiceAtual];
  if(m) app.musicasComProblema.add(m.id);
  setTimeout(next, 150);
});
audio.addEventListener('timeupdate', ()=>{
  if(audio.duration){
    $('progressFill').style.width = (audio.currentTime/audio.duration*100) + '%';

// ═══════════════════════════════════════════════════════
// BAIXAR GÊNERO (D2) — CORRIGIDO
// ═══════════════════════════════════════════════════════
let baixando = false;
let baixarCancelado = false;

async function baixarGenero(genero){
  if(baixando){ notif('⚠️ Já tem download rodando'); return; }
  if(generoOffline(genero)){ notif('✅ Já está offline'); return; }

  const musicas = await buscarGenero(genero);
  if(!musicas || !musicas.length){ notif('❌ Erro ao buscar músicas'); return; }

  baixando = true;
  baixarCancelado = false;
  $('modalDownload').classList.add('open');
  $('dlTitulo').textContent = '📥 ' + genero;
  $('dlStatus').textContent = 'Preparando...';
  $('dlFill').style.width = '0%';
  $('dlContador').textContent = '0 / ' + musicas.length;
  $('dlAtual').textContent = '';
  $('dlCancelar').style.display = 'flex';
  $('fecharDownload').style.display = 'none';

  let baixadas = 0, falhas = 0;
  for(let i = 0; i < musicas.length; i++){
    if(baixarCancelado) break;
    const m = musicas[i];
    const urls = getUrls(m);
    let ok = false;
    for(const u of urls){
      if(await estaOffline(u)){ ok = true; break; }
      if(await salvarOffline(u)){ ok = true; break; }
    }
    if(ok) baixadas++; else falhas++;
    const pct = ((i+1)/musicas.length)*100;
    $('dlFill').style.width = pct + '%';
    $('dlContador').textContent = (i+1) + ' / ' + musicas.length + '  (✅ ' + baixadas + '  ❌ ' + falhas + ')';
    $('dlAtual').textContent = (m.title||'').slice(0, 30);
    $('dlStatus').textContent = 'Baixando... ' + Math.round(pct) + '%';
    if((i+1) % 5 === 0){
      const meta = getOfflineMeta();
      meta[genero] = { baixadas, total: musicas.length, data: now(), parcial: true };
      setOfflineMeta(meta);
    }
    if((i+1) % 3 === 0) await sleep(20);
  }

  const meta = getOfflineMeta();
  meta[genero] = { baixadas, total: musicas.length, falhas, data: now(), completo: baixadas === musicas.length };
  setOfflineMeta(meta);

  baixando = false;
  baixarCancelado = false;

  if(baixadas > 0){
    $('dlStatus').textContent = '✅ ' + baixadas + ' de ' + musicas.length + ' salvas!';
    notif('✅ ' + baixadas + ' músicas offline!');
  }else{
    $('dlStatus').textContent = '❌ Nenhuma salva';
    notif('❌ Falha no download');
  }
  $('dlCancelar').style.display = 'none';
  $('fecharDownload').style.display = 'flex';
  renderizarGeneros();
}

// BUSCA (sem Relevância)
// ═══════════════════════════════════════════════════════
function initBusca(){
  const sel = $('buscaGenero');
  GENEROS.forEach(g => {
    const o = document.createElement('option');
    o.value = g; o.textContent = '🎸 ' + g;
    sel.appendChild(o);
  });

  $('buscaInput').addEventListener('input', debounce(buscar, 300));
  $('buscaGenero').addEventListener('change', buscar);
  $('buscaOrdem').addEventListener('change', buscar);
}
function debounce(fn, ms){
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); };
}
async function buscar(){
  const termo = $('buscaInput').value.trim().toLowerCase();
  const genero = $('buscaGenero').value;
  const ordem = $('buscaOrdem').value;
  const cont = $('buscaResultados');
  const count = $('buscaCount');

  let base = app.musicas;
  // Se buscou em outro gênero, carrega
  if(genero && genero !== app.modoAtual){
    const g = await buscarGenero(genero);
    if(g) base = g;
  }

  let res = base;
  if(termo){
    res = res.filter(m =>
      (m.title && m.title.toLowerCase().includes(termo)) ||
      (m.artist && m.artist.toLowerCase().includes(termo))
    );
  }
  if(ordem === 'az') res = [...res].sort((a,b)=>a.title.localeCompare(b.title));
  else if(ordem === 'za') res = [...res].sort((a,b)=>b.title.localeCompare(a.title));
  else if(ordem === 'aleatorio') res = shuffle(res);

  count.textContent = res.length === 0 ? '❌ Nada encontrado' : '✅ ' + res.length + ' resultado(s)';

  cont.innerHTML = '';
  if(!res.length){
    cont.innerHTML = '<div style="text-align:center;padding:30px;color:#666">😕 Nada encontrado</div>';
    return;
  }

  res.slice(0, 80).forEach(m => {
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML =
      '<div class="icon"><i class="fas fa-music"></i></div>' +
      '<div class="info"><span class="title">' + sanitize(m.title) + '</span>' +
      '<span class="artist">' + sanitize(m.artist) + '</span></div>' +
      '<span class="genero">' + (m.genero||'') + '</span>';
    item.onclick = () => {
      // ✅ Fecha ANTES de tocar
      fecharModal('modalBusca');
      setTimeout(()=>{
        const idx = app.playlistAtual.findIndex(x=>x.id===m.id);
        if(idx > -1) app.indiceAtual = idx;
        else { app.playlistAtual = [m, ...shuffle(app.musicas.filter(x=>x.id!==m.id))]; app.indiceAtual = 0; }
        if(app.playerAtivado) tocar();
        notif('🎵 ' + m.title);
      }, 100);
    };
    cont.appendChild(item);
  });
}

// ═══════════════════════════════════════════════════════
// MÍDIA DE FUNDO — com fallback visual
// ═══════════════════════════════════════════════════════
let midiaTimer = null;
async function carregarMidias(container, lista, opcoes={}){
  const { tela='principal' } = opcoes;
  if(midiaTimer){ clearTimeout(midiaTimer); midiaTimer = null; }
  container.querySelectorAll('video').forEach(v=>{ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} });
  container.querySelectorAll('video,img').forEach(el=>{ if(!el.classList.contains('media-fallback')) el.remove(); });

  let ms = lista && lista.length ? lista : [];
  if(!ms.length){ return; }

  const els = [];
  ms.forEach((m, i) => {
    let el;
    if(m.tipo === 'video'){
      el = document.createElement('video');
      el.src = m.src;
      el.muted = true; el.loop = false; el.playsInline = true;
      el.setAttribute('playsinline','');
      el.setAttribute('muted','');
      el.preload = 'auto';
      el.addEventListener('error', ()=>{ el.dataset.erro = '1'; });
    }else{
      el = document.createElement('img');
      el.src = m.src;
      el.onerror = ()=>{ el.dataset.erro = '1'; };
    }
    el.className = i === 0 ? 'active' : '';
    container.appendChild(el);
    els.push(el);
  });

  if(!els.length) return;
  let idx = 0;

  function tocarIdx(n){
    const el = els[n];
    if(!el) return;
    els.forEach((x, j) => { x.classList.toggle('active', j === n); });

    if(el.tagName === 'VIDEO'){
      els.forEach((x, j) => { if(x.tagName==='VIDEO' && j!==n){ try{ x.pause(); x.currentTime=0; }catch(e){} } });
      try{ el.currentTime = 0; }catch(e){}
      const p = el.play();
      if(p && p.catch){ p.catch(()=>{}); }
      el.onended = ()=>{ idx = (idx+1) % els.length; tocarIdx(idx); };
      midiaTimer = setTimeout(()=>{
        if(idx === n){ idx = (idx+1) % els.length; tocarIdx(idx); }
      }, CONFIG.MIDIA_MAX_SEGURANCA_MS);
    }else{
      midiaTimer = setTimeout(()=>{
        if(idx === n){ idx = (idx+1) % els.length; tocarIdx(idx); }
      }, 5000);
    }
  }

  // Verifica se TODAS as mídias falharam → deixa fallback
  setTimeout(()=>{
    const todasFalharam = els.every(e => e.dataset.erro === '1');
    if(todasFalharam){ notif('⚠️ Mídia indisponível'); }
  }, 5000);

  tocarIdx(0);
}

// ═══════════════════════════════════════════════════════
function agendarCiclo(){
  const t = app.telaAtual === 'principal' ? CONFIG.CICLO_PRINCIPAL_MS : CONFIG.CICLO_ANUNCIO_MS;
  setTimeout(async ()=>{
    if(!app.playerAtivado){ agendarCiclo(); return; }
    // Se tiver modal aberto, pula
    if(document.querySelector('.modal.open')){ agendarCiclo(); return; }
    if(app.telaAtual === 'principal') await trocarTela('anuncios');
    else await trocarTela('principal');
    agendarCiclo();
  }, t);
}
async function trocarTela(destino){
  if(destino === 'anuncios'){
    app.telaAtual = 'anuncios';
    $('app').style.opacity = '0';
    $('app').style.pointerEvents = 'none';
    $('telaAnuncios').classList.add('ativa');

    app.playlistAtual = shuffle(m);
    app.indiceAtual = 0;
    const mm = app.playlistAtual[0];
    if(mm){ atualizarLetreiro(mm); atualizarInfoMusica(mm); }
  }

  // Carrega mídias de fundo
  await carregarMidias($('mediaBg'), MIDIAS_FUNDO, { tela:'principal' });

  // Mostra app
  await sleep(1500);
  $('loadingScreen').classList.add('hide');
  $('app').classList.add('visible');

  atualizarBadgeFav();
  initBusca();
  initFab();

  // Eventos
  $('playBtn').onclick = togglePlay;
  $('prevBtn').onclick = prev;
  $('nextBtn').onclick = next;
  $('btnCoracao').onclick = toggleFavAtual;
  $('menuBtn').onclick = () => { vibrar(); notif('⚙️ Use o botão +'); };

  // Barra inferior
  $('barraBuscar').onclick = () => { vibrar(); abrirModal('modalBusca'); };
  $('barraFavoritas').onclick = () => { vibrar(); renderFavoritas(); abrirModal('modalFavoritas'); };
  $('barraGeneros').onclick = () => { vibrar(); renderizarGeneros(); abrirModal('modalGeneros'); };

  // Fechar modais
  $('fecharBusca').onclick = () => fecharModal('modalBusca');
  $('fecharFavoritas').onclick = () => fecharModal('modalFavoritas');
  $('fecharGeneros').onclick = () => fecharModal('modalGeneros');
  $('fecharDownload').onclick = () => fecharModal('modalDownload');
  $('dlCancelar').onclick = () => { baixarCancelado = true; notif('🛑 Cancelando...'); };
  document.querySelectorAll('.modal').forEach(m => {
    m.onclick = (e) => { if(e.target === m) m.classList.remove('open'); };
  });

  // Letreiro → abre busca
  $('letreiroClick').onclick = () => abrirModal('modalBusca');

  // Progress bar
  const pb = $('progressBar');
  pb.onclick = (e) => {
    if(!audio.duration) return;
    const r = pb.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  };

  // Primeiro toque ativa player
  document.addEventListener('touchstart', ativarPlayer, { once:true });
  document.addEventListener('click', ativarPlayer, { once:true });

  // Teclado
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === ' '){ e.preventDefault(); togglePlay(); }
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
  });

  // Ciclo de telas
  setTimeout(agendarCiclo, 15000);

  // Esconder controles após 30s (opcional)
  setTimeout(()=>{
    $('painelBaixo').classList.add('escondido');
    $('infoTopo').classList.add('escondido');
  }, 30000);
  document.addEventListener('click', ()=>{
    $('painelBaixo').classList.remove('escondido');
    $('infoTopo').classList.remove('escondido');
  });

  notif('✅ VDB DEMO pronta!');
}

iniciar();

})();
</script>
</body>
</html>
