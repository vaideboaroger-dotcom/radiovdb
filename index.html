/* ═══ SENHA MODERNA HMAC LOCAL ═══ */
const _K = [118,100,98,45,118,54,50,45,115,101,99,114,101,116].map(c=>String.fromCharCode(c)).join('');
function _h(str){
  let h1=0x811c9dc5, h2=0x1000193;
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    h1^=c; h1=(h1*0x01000193)>>>0;
    h2=((h2^c)*0x85ebca6b)>>>0;
    h2=((h2<<13)|(h2>>>19))>>>0;
  }
  return (h1>>>0).toString(36)+(h2>>>0).toString(36);
}
const _A2='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function _gerarSenhaParaId(id){
  const base=id+'|'+_K;
  const h=_h(base)+_h(base+_K)+_h(_K+base);
  let out='';
  for(let i=0;i<12;i++){
    const seg=h.substring(i*2,i*2+3)||'000';
    out+=_A2[parseInt(seg,36)%_A2.length];
  }
  return 'VDB-'+out.substring(0,4)+'-'+out.substring(4,8)+'-'+out.substring(8,12);
}
function _validarSenhaNova(senha,meuId){
  if(!senha||!meuId) return false;
  return senha.trim().toUpperCase()===_gerarSenhaParaId(meuId).toUpperCase();
}
function _validarSenhaAntiga(senha,meuId){
  try{
    const d=atob(senha.trim());
    const parts=d.split(':');
    return parts.length===2&&parts[0]===meuId;
  }catch(e){ return false; }
}
function validarSenha(senha){
  if(!senha) return {valida:false};
  const meuId=obterMeuId();
  if(senha===SENHA_MESTRA) return {valida:true,msg:'✅ Liberado!',tipo:'mestra'};
  if(senha===SENHA_ADMIN) return {valida:true,msg:'✅ Admin!',tipo:'admin'};
  if(_validarSenhaNova(senha,meuId)) return {valida:true,msg:'✅ Liberado!',tipo:'nova'};
  if(_validarSenhaAntiga(senha,meuId)) return {valida:true,msg:'✅ Liberado!',tipo:'antiga'};
  return {valida:false};
}

function gerarIdCurto(){
  const n=navigator.userAgent||'';
  const p=navigator.platform||'';
  const l=navigator.language||'';
  const s=screen.width+'x'+screen.height+'x'+screen.colorDepth;
  const t=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  const seed=n+'|'+p+'|'+l+'|'+s+'|'+t;
  let h1=0,h2=0;
  for(let i=0;i<seed.length;i++){
    const c=seed.charCodeAt(i);
    h1=((h1<<5)-h1)+c; h1|=0;
    h2=((h2<<3)+c)^h1; h2|=0;
  }
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let a='',b='';
  const abs1=Math.abs(h1),abs2=Math.abs(h2);
  for(let i=0;i<4;i++) a+=chars[(abs1>>(i*5))%32];
  for(let i=0;i<4;i++) b+=chars[(abs2>>(i*5))%32];
  return 'VDB-'+a+'-'+b;
}
function obterMeuId(){
  let id=localStorage.getItem('vdb_meu_id');
  if(!id||!id.startsWith('VDB-')){
    id=gerarIdCurto();
    localStorage.setItem('vdb_meu_id',id);
  }
  return id;
}

function assinarExpiracao(exp){

}

async function verificarTempo(){
  if(localStorage.getItem(CHAVE_BLOQ)==='true') return {liberado:false};
  const expSalva = parseInt(localStorage.getItem(CHAVE_EXPIRA) || '0');
  const sigSalva = localStorage.getItem(CHAVE_EXPIRA+'_sig');
  if(expSalva && sigSalva && sigSalva === assinarExpiracao(expSalva)){
    if(Date.now() > expSalva) return {liberado:false, expiracao:expSalva};
    return {liberado:true, expiracao:expSalva};
  }
  if(localStorage.getItem(CHAVE_DESBLOQ)==='true'){
    if(desbloqueioLegitimo()) return {liberado:true,expiracao:Infinity};
    localStorage.removeItem(CHAVE_DESBLOQ);
    localStorage.removeItem(CHAVE_DESBLOQ+'_sig');
  }
  const e=Date.now()+CONFIG.TEMPO_TESTE_SEGUNDOS*1000;
  localStorage.setItem(CHAVE_EXPIRA,String(e));
  localStorage.setItem(CHAVE_EXPIRA+'_sig',assinarExpiracao(e));
  return {liberado:true,expiracao:e};
}
async function tempoRestante(){
  const r=await verificarTempo();
  if(!r.liberado) return 0;
  if(r.expiracao===Infinity) return CONFIG.TEMPO_TESTE_SEGUNDOS;
  return Math.max(0,Math.floor((r.expiracao-Date.now())/1000));
}
function fmtTempo(s){
  if(s<0)s=0; s=Math.floor(s);
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600);
  const m=Math.floor((s%3600)/60),sg=Math.floor(s%60);
  if(d>0) return d+'d '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sg).padStart(2,'0');
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sg).padStart(2,'0');
}

function shuffle(a){
  if(!a||!a.length) return [];
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
}

async function processNotif(){
  if(nShowing||!nQ.length) return;
  nShowing=true;
  const it=nQ.shift();
  const el=$('notification');
  el.textContent=it.msg;
  el.classList.add('show');
  await sleep(it.dur);
  el.classList.remove('show');
  nShowing=false;
  setTimeout(processNotif,200);
}

const cacheGenero=new Map();
const LIMITE_CACHE=5;
async function buscarGenero(genero){
  if(cacheGenero.has(genero)){
    const v=cacheGenero.get(genero);
    cacheGenero.delete(genero); cacheGenero.set(genero,v);
    return v;
  }
  const url=GENRE_URLS[genero];
  if(!url) return null;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),9000);
    const r=await fetch(url,{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok) throw new Error('HTTP');
    let j=await r.json();
    if(!Array.isArray(j)) j=j.musicas||j.data||Object.values(j)[0];
    const ms=(j||[]).filter(m=>m&&m.src&&m.title).map(m=>({
      ...m,
      id:'fav_'+(m.title+'_'+(m.artist||'Artista')).toLowerCase().replace(/[^a-z0-9]+/g,'_'),
      genero, artist:m.artist||'Artista'
    }));
    cacheGenero.set(genero,ms);
    if(cacheGenero.size>LIMITE_CACHE) cacheGenero.delete(cacheGenero.keys().next().value);
    return ms;
  }catch(e){ return null; }
}
function getUrls(m){
  const s=m.src||'';
  if(!s) return [];
  if(s.startsWith('http')) return [s];
  const nome=s.replace(/^\.\//,'').replace(/[^a-zA-Z0-9\-_.]/g,'');
  if(!nome) return [];
  const repo=GENRE_REPOS[m.genero]||'radiolojasjc-hub/play12';
  return ['https://raw.githubusercontent.com/'+repo+'/refs/heads/main/'+nome];
}

const audio=$('musicPlayer');
let falhasConsecutivas=0;
function atualizarPlaylist(){
  if(!appState.musicas.length) return null;
  if(!appState.playlistAtual.length){
    appState.playlistAtual=shuffle(appState.musicas);
    appState.indiceAtual=0;
  }
  if(appState.indiceAtual>=appState.playlistAtual.length){
    appState.playlistAtual=shuffle(appState.musicas);
    appState.indiceAtual=0;
  }
  return appState.playlistAtual[appState.indiceAtual]||null;
}
async function tocar(){
  if(!appState.isBackgroundActive||appState.carregando||!appState.musicas.length) return;
  appState.carregando=true;
  try{
    $('playBtn').innerHTML='<i class="fas fa-spinner fa-spin"></i>';
    const m=atualizarPlaylist();
    if(!m){ appState.carregando=false; return; }
    atualizarLetreiro(m); atualizarInfoMusica(m); atualizarCoracao();
    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.setActionHandler('play',()=>togglePlay());
        navigator.mediaSession.setActionHandler('pause',()=>togglePlay());
        navigator.mediaSession.setActionHandler('previoustrack',()=>prev());
        navigator.mediaSession.setActionHandler('nexttrack',()=>next());
      }catch(e){}
      try{
        navigator.mediaSession.metadata=new MediaMetadata({
          title:m.title||'VDB', artist:m.artist||'Artista',
          album:m.genero||'Música',
          artwork:[{src:'favicon512.png',sizes:'512x512',type:'image/png'}]
        });
      }catch(e){}
    }
    try{ audio.pause(); }catch(e){}
    audio.removeAttribute('src'); audio.load();
    const urls=getUrls(m).slice(0,8);
    let ok=false;
    for(const u of urls){
      try{
        const car=await new Promise(r=>{
          const t=setTimeout(()=>{audio.oncanplay=null;audio.onerror=null;r(false);},8000);
          audio.oncanplay=()=>{clearTimeout(t);audio.oncanplay=null;audio.onerror=null;r(true);};
          audio.onerror=()=>{clearTimeout(t);audio.oncanplay=null;audio.onerror=null;r(false);};
          audio.src=u; audio.load();
        });
        if(car){ ok=true; break; }
      }catch(e){}
    }
    if(ok){
      try{
        audio.volume=CONFIG.VOLUME_PADRAO;
        await audio.play();
        appState.isPlaying=true;
        falhasConsecutivas=0;
        $('playBtn').innerHTML='<i class="fas fa-pause"></i>';
      }catch(e){
        $('playBtn').innerHTML='<i class="fas fa-play"></i>';
        falhasConsecutivas++;
        if(falhasConsecutivas<5) setTimeout(next,400);
      }
    }else{
      appState.musicasComProblema.add(m.id);
      $('playBtn').innerHTML='<i class="fas fa-play"></i>';
      falhasConsecutivas++;
      if(falhasConsecutivas<5) setTimeout(next,400);
    }
  }catch(e){ console.error(e); }
  finally{ appState.carregando=false; }
}
function togglePlay(){
  vibrar();
  if(!appState.isBackgroundActive){ notif('🔊 Toque na tela'); return; }
  if(audio.paused) tocar();
  else{
    audio.pause();
    appState.isPlaying=false;
    $('playBtn').innerHTML='<i class="fas fa-play"></i>';
  }
}
function next(){
  vibrar();
  if(appState.carregando) return;
  if(!appState.playlistAtual.length&&!appState.musicas.length) return;
  appState.indiceAtual++;
  if(appState.isBackgroundActive) setTimeout(tocar,100);
}

/* ═══ DOWNLOAD ═══ */
let downloadEmAndamento=false;
let downloadCancelado=false;
let downloadGeneroAtual='';
const CACHE_NAME='vdb-offline-'+CONFIG.APP_VERSION;

async function abrirCache(){
  if(!('caches' in window)) return null;
  try{ return await caches.open(CACHE_NAME); }catch(e){ return null; }
}
function urlLimpa(url){
  try{const u=new URL(url);u.searchParams.delete('v');u.searchParams.delete('t');return u.toString();}
  catch(e){ return url.split('?')[0]; }
}
async function estaOffline(url){
  if(!url) return false;
  const c=await abrirCache(); if(!c) return false;
  try{ return !!(await c.match(urlLimpa(url))); }catch(e){ return false; }
}
async function salvarOffline(url,timeoutMs=30000){
  if(!url||!url.startsWith('http')) return false;
  const c=await abrirCache(); if(!c) return false;
  const limpa=urlLimpa(url);
  try{
    if(await c.match(limpa)) return true;
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),timeoutMs);
    const r=await fetch(url,{mode:'cors',signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok) return false;
    await c.put(limpa,r.clone());
    return true;
  }catch(e){ return false; }
}
function getOfflineMeta(){try{return JSON.parse(localStorage.getItem('vdb_offline')||'{}');}catch(e){return {};}}
function setOfflineMeta(m){try{localStorage.setItem('vdb_offline',JSON.stringify(m));}catch(e){}}
function generoOffline(g){const m=getOfflineMeta();return !!(m[g]&&m[g].completo);}
async function limparGeneroOffline(genero){
  const c=await abrirCache(); if(!c) return;
  const repo=GENRE_REPOS[genero]||'';
  const ks=await c.keys();
  for(const k of ks){ if(repo&&k.url.includes(repo)) await c.delete(k); }
  const meta=getOfflineMeta(); delete meta[genero]; setOfflineMeta(meta);
}

async function baixarGeneroCompleto(genero,musicas,onProgress){
  if(downloadEmAndamento) return {erro:'ja_rodando'};
  if(!musicas||!musicas.length) return {erro:'sem_musicas'};
  downloadEmAndamento=true; downloadCancelado=false; downloadGeneroAtual=genero;
  let baixadas=0,falhas=0;
  const total=musicas.length;
  if(onProgress) onProgress({atual:0,total,baixadas:0,falhas:0,musicaAtual:'Preparando...',genero});
  for(let i=0;i<musicas.length;i++){
    if(downloadCancelado) break;
    const m=musicas[i];
    const urls=getUrls(m);
    if(!urls.length){
      falhas++;
      if(onProgress) onProgress({atual:i+1,total,baixadas,falhas,musicaAtual:m.title||'',genero});
      continue;
    }
    let ok=false;
    for(const u of urls){
      if(downloadCancelado) break;
      if(await estaOffline(u)){ ok=true; break; }
      for(let t=1;t<=CONFIG.DOWNLOAD_RETRY;t++){
        if(downloadCancelado) break;
        const salvou=await salvarOffline(u,CONFIG.DOWNLOAD_TIMEOUT_MS);
        if(salvou){ ok=true; break; }
        if(t<CONFIG.DOWNLOAD_RETRY) await sleep(500);
      }
      if(ok) break;
    }
    if(ok) baixadas++; else falhas++;
    if(onProgress) onProgress({atual:i+1,total,baixadas,falhas,musicaAtual:(m.title||'').slice(0,40),genero});
    if((i+1)%10===0){
      const meta=getOfflineMeta();
      meta[genero]={baixadas,total,falhas,data:now(),parcial:true};
      setOfflineMeta(meta);
    }
    if((i+1)%3===0) await sleep(CONFIG.DOWNLOAD_DELAY_MS);
  }
  const meta=getOfflineMeta();
  meta[genero]={baixadas,total,falhas,data:now(),completo:baixadas===total||(baixadas>=total*0.9)};
  setOfflineMeta(meta);
  const foiCancelado=downloadCancelado;
  downloadEmAndamento=false; downloadCancelado=false; downloadGeneroAtual='';
  return {baixadas,falhas,total,cancelado:foiCancelado};
}

async function iniciarDownloadGenero(genero){
  if(downloadEmAndamento){ notif('⚠️ Já tem download em andamento'); return; }
  if(generoOffline(genero)){ notif('✅ Já está offline'); return; }
  $('downloadModal').classList.add('active');
  $('dlTitulo').textContent='📥 '+genero;
  $('dlSub').textContent='Preparando...';
  $('dlFill').style.width='0%';
  $('dlContador').textContent='0 / 0';
  $('dlPercent').textContent='0%';
  $('dlAtual').textContent='';
  $('dlCancelar').style.display='block';
  $('dlFechar').style.display='none';
  const musicas=await buscarGenero(genero);
  if(!musicas||!musicas.length){
    notif('❌ Erro ao carregar');
    $('downloadModal').classList.remove('active');
    return;
  }
  renderizarGeneros();
  const res=await baixarGeneroCompleto(genero,musicas,(prog)=>{
    const pct=Math.round((prog.atual/prog.total)*100);
    $('dlFill').style.width=pct+'%';
    $('dlContador').textContent=prog.atual+' / '+prog.total+'  (✅ '+prog.baixadas+'  ❌ '+prog.falhas+')';
    $('dlPercent').textContent=pct+'%';
    $('dlAtual').textContent=prog.musicaAtual||'';
    $('dlSub').textContent=prog.baixadas+' baixadas';
  });
  if(res.cancelado){ $('dlSub').textContent='🛑 Cancelado'; }
  else if(res.baixadas>0){
    $('dlSub').textContent='✅ '+res.baixadas+' de '+res.total+' baixadas!';
    notif('✅ '+res.baixadas+' músicas offline!',3000);
  }else{
    $('dlSub').textContent='❌ Nenhuma música baixada';
    notif('❌ Falha no download',3000);
  }
  $('dlCancelar').style.display='none';
  $('dlFechar').style.display='block';
  renderizarGeneros();
  if(!res.cancelado&&res.baixadas>0) setTimeout(()=>$('downloadModal').classList.remove('active'),3000);
}

async function abrirGerenciadorOffline(){
  const meta=getOfflineMeta();
  const gs=Object.keys(meta);
  if(!gs.length){ notif('📥 Nada baixado'); return; }
  let txt='📥 OFFLINE\n\n';
  gs.forEach(g=>{const info=meta[g];txt+='• '+g+': '+info.baixadas+'/'+info.total+(info.completo?' ✅':' ⏳')+'\n';});
  const acao=confirm(txt+'\n\nApagar tudo?');
  if(acao){
    const c=await abrirCache();
    if(c){const ks=await c.keys();for(const k of ks) await c.delete(k);}
    setOfflineMeta({}); notif('🗑️ Offline limpo!'); renderizarGeneros();
  }
}

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
async function buscar(){
  const termo=$('buscaInput').value.trim().toLowerCase();
  const genero=$('buscaGenero').value;
  const ordem=$('buscaOrdem').value;
  const cont=$('buscaResultados');
  const count=$('buscaCount');
  if(!termo&&!genero){
    count.textContent='💡 Digite ou escolha um gênero';
    cont.innerHTML='<div style="text-align:center;padding:40px;color:#888;font-size:.85rem">🔍 Digite o nome da música</div>';
    return;
  }
  let base=Array.isArray(appState.musicas)?appState.musicas:[];
  if(genero){
    try{ const g=await buscarGenero(genero); if(Array.isArray(g)) base=g; }catch(e){}
  }
  let res=base;
  if(termo){
    res=res.filter(m=>(m.title&&m.title.toLowerCase().includes(termo))||(m.artist&&m.artist.toLowerCase().includes(termo)));
  }
  if(ordem==='az') res=[...res].sort((a,b)=>a.title.localeCompare(b.title));
  else if(ordem==='za') res=[...res].sort((a,b)=>b.title.localeCompare(a.title));
  else if(ordem==='aleatorio') res=shuffle(res);
  count.textContent=res.length===0?'❌ Nada':'✅ '+res.length+' resultado(s)';
  cont.innerHTML='';
  if(!res.length){
    cont.innerHTML='<div style="text-align:center;padding:40px;color:#888">😕 Nada encontrado</div>';
    return;
  }
  res.slice(0,100).forEach(m=>{
    const item=document.createElement('div');
    item.className='result-item';
    item.innerHTML='<div class="icon"><i class="fas fa-music"></i></div><div class="info"><span class="title">'+sanitize(m.title)+'</span><span class="artist">'+sanitize(m.artist)+'</span></div><span class="genero">'+(m.genero||'')+'</span>';
    item.onclick=()=>{
      fecharModal('modalBusca');
      setTimeout(()=>{
        const idx=appState.playlistAtual.findIndex(x=>x.id===m.id);
        if(idx>-1) appState.indiceAtual=idx;
        else{
          appState.playlistAtual=[m,...shuffle(appState.musicas.filter(x=>x.id!==m.id))];
          appState.indiceAtual=0;
        }
        if(appState.isBackgroundActive) tocar();
        notif('🎵 '+m.title);
      },100);
    };
    cont.appendChild(item);
  });
}

let fsEmAndamento=false;
let fsGuardInterval=null;
function jaFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function forcarFullscreen(){
  if(jaFullscreen()) return true;
  if(fsEmAndamento) return false;
  fsEmAndamento=true;
  try{
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req){
      const r=req.call(el);
      if(r&&r.then){ r.then(()=>{fsEmAndamento=false;}).catch(()=>{fsEmAndamento=false;}); }
      else fsEmAndamento=false;
      return true;
    }
    fsEmAndamento=false; return false;
  }catch(e){ fsEmAndamento=false; return false; }
}
function iniciarFullscreenGuard(){
  if(fsGuardInterval) clearInterval(fsGuardInterval);
  fsGuardInterval=setInterval(()=>{
    if(document.hidden) return;
    if(!appState.playerAtivado) return;
    if(jaFullscreen()) return;
    forcarFullscreen();
  },1500);
}

function criarSilentAudio(){
  const sr=44100,ns=sr;
  const b=new ArrayBuffer(44+ns*2);
  const v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+ns*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,ns*2,true);
  return new Blob([b],{type:'audio/wav'});
}
let silentUrl=null;
function getSilentUrl(){ if(!silentUrl) silentUrl=URL.createObjectURL(criarSilentAudio()); return silentUrl; }
let keepAliveInterval=null;
function manterAtivo(){
  if(keepAliveInterval) clearInterval(keepAliveInterval);
  keepAliveInterval=setInterval(()=>{
    if(!appState.isBackgroundActive) return;
    try{
      const bg=$('backgroundAudio');
      if(bg.paused) bg.play().catch(()=>{});
      if(appState.isPlaying && audio.paused && !appState.carregando && !document.hidden){
        audio.play().catch(()=>{});
      }
    }catch(e){}
  },3000);
}
async function ativarPlayer(){
  if(appState.playerAtivado) return;
  appState.playerAtivado=true;
  try{
    const bg=$('backgroundAudio');
    bg.src=getSilentUrl();
    bg.loop=true;
    bg.volume=0;
    await bg.play();
    appState.isBackgroundActive=true;
    manterAtivo();
    forcarFullscreen();
    iniciarFullscreenGuard();
    await iniciarTimer();
    setTimeout(tocar,500);
  }catch(e){
    appState.isBackgroundActive=true;
    forcarFullscreen();
    iniciarFullscreenGuard();
    iniciarTimer();
    setTimeout(tocar,500);
  }
}

async function carregarMidias(container,url,options={}){
  const {fallback=[]}=options;
  const meuToken=Symbol('midia');
  let localTimer=null;
  container._midiaToken=meuToken;
  container.querySelectorAll('video').forEach(v=>{try{v.pause();v.removeAttribute('src');v.load();}catch(e){}});
  container.querySelectorAll('video,img').forEach(el=>el.remove());
  try{
    let ms=[];
    if(url){
      try{
        const ctrl=new AbortController();
        const tid=setTimeout(()=>ctrl.abort(),9000);
        const r=await fetch(url,{signal:ctrl.signal});
        clearTimeout(tid);
        if(r.ok){
          const d=await r.json();
          if(Array.isArray(d)) ms=d;
          else if(d.medias) ms=d.medias;
          else if(d.midias) ms=d.midias;
        }
      }catch(e){}
    }
    if(container._midiaToken!==meuToken) return;
    if(!ms.length) ms=fallback;
    ms=ms.filter(m=>m&&(m.tipo==='video'||m.tipo==='imagem')&&m.src);
    if(!ms.length) return;
    const els=[];
    ms.forEach((m,i)=>{
      let el;
      if(m.tipo==='video'){
        el=document.createElement('video');
        el.src=m.src; el.muted=true; el.loop=false; el.playsInline=true;
        el.setAttribute('playsinline','');
        el.setAttribute('webkit-playsinline','');
        el.setAttribute('muted','');
        el.preload='auto';
        el.addEventListener('error',()=>{el.dataset.erro='1';});
      }else{
        el=document.createElement('img');
        el.src=m.src;
        el.onerror=()=>{el.dataset.erro='1';};
      }
      el.className=i===0?'active':'inactive';
      container.appendChild(el); els.push(el);
    });
    if(!els.length) return;
    let idx=0;
    function tocarIdx(n){
      if(container._midiaToken!==meuToken) return;
      if(localTimer) clearTimeout(localTimer);
      const el=els[n];
      if(!el) return;
      els.forEach((x,j)=>{x.classList.toggle('active',j===n);});
      if(el.tagName==='VIDEO'){
        els.forEach((x,j)=>{if(x.tagName==='VIDEO'&&j!==n){try{x.pause();x.currentTime=0;}catch(e){}}});
        try{el.currentTime=0;}catch(e){}
        el.play().catch(()=>{});
        el.onended=()=>{if(container._midiaToken!==meuToken) return;setTimeout(()=>{idx=(idx+1)%els.length;tocarIdx(idx);},700);};
        localTimer=setTimeout(()=>{if(container._midiaToken===meuToken&&idx===n){idx=(idx+1)%els.length;tocarIdx(idx);}},CONFIG.MIDIA_MAX_SEGURANCA_MS);
      }else{
        localTimer=setTimeout(()=>{if(container._midiaToken===meuToken&&idx===n){idx=(idx+1)%els.length;tocarIdx(idx);}},5000);
      }
    }
    tocarIdx(0);
  }catch(e){ console.error('Erro mídias:',e); }
}
async function carregarMidiasPadrao(){
  await carregarMidias($('mediaContainer'),MIDIAS_PADRAO_URL,{fallback:MIDIAS_FALLBACK});
}
async function carregarMidiasAnuncio(){
  await carregarMidias($('mediaAnuncios'),MIDIAS_ANUNCIO_URL,{fallback:MIDIAS_ANUNCIO_FALLBACK});
}

let cicloTimer=null;
function agendarCiclo(){
  clearTimeout(cicloTimer);
  const t=appState.telaAtual==='principal'?CONFIG.CICLO_PRINCIPAL_MS:CONFIG.CICLO_ANUNCIO_MS;
  cicloTimer=setTimeout(async()=>{
    if(!appState.playerAtivado){ agendarCiclo(); return; }
    if(document.querySelector('.modal.open, #adminPanel.open, #qrCodeModal.active, #downloadModal.active')){
      agendarCiclo(); return;
    }
    if(appState.telaAtual==='principal') await trocarTela('anuncios');
    else await trocarTela('principal');
    if(!jaFullscreen()) forcarFullscreen();
    agendarCiclo();
  },t);
}
async function trocarTela(destino){
  if(destino==='anuncios'){
    appState.telaAtual='anuncios';
    $('telaPrincipal').classList.add('oculta');
    $('telaAnuncios').classList.add('ativa');
    if($('barraInferior')) $('barraInferior').classList.add('escondida');
    await carregarMidiasAnuncio();
  }else{
    appState.telaAtual='principal';
    $('telaAnuncios').classList.remove('ativa');
    $('telaPrincipal').classList.remove('oculta');
    if($('barraInferior')) $('barraInferior').classList.remove('escondida');
    await carregarMidiasPadrao();
  }
}

function initFab(){
  const main=$('fabMain'),menu=$('fabMenu');
  main.onclick=()=>{
    vibrar();
    const open=menu.classList.toggle('open');
    main.classList.toggle('open',open);
  };

  $('fabFavoritos').onclick=()=>{fecharFab();renderFavoritas();abrirModal('modalFavoritas');};
  $('fabGeneros').onclick=()=>{fecharFab();renderizarGeneros();abrirModal('modalGeneros');};
  $('fabRadio').onclick=()=>{fecharFab();ativarRadio();};
  $('fabBaixarAtual').onclick=()=>{
    fecharFab();
    if(ehModoRadio()){ notif('⚠️ Escolha um gênero primeiro'); return; }
    if(appState.modoAtual==='FAVORITAS'){ notif('⚠️ Escolha um gênero primeiro'); return; }

  };
  $('fabGerenciarOffline').onclick=()=>{fecharFab();abrirGerenciadorOffline();};
  $('fabTemas').onclick=()=>{fecharFab();trocarTema();};
  $('fabFullscreen').onclick=()=>{fecharFab();forcarFullscreen();notif('🖥️ Tela cheia');};
  $('fabSleep').onclick=()=>{
    fecharFab();
    const mins=parseInt(prompt('⏰ Desligar em minutos:','15'));
    if(mins>0){
      clearTimeout(appState.sleepTimerId);
      appState.sleepTimerId=setTimeout(()=>{
        audio.pause();
        appState.isPlaying=false;
        $('playBtn').innerHTML='<i class="fas fa-play"></i>';
        notif('💤 Player desligado');
      },mins*60000);
      notif('⏰ Sleep: '+mins+' min');
    }
  };
  $('fabRecarregar').onclick=()=>{fecharFab();location.reload();};
  $('fabAtualizarMidia').onclick=async()=>{fecharFab();notif('🔄 Atualizando...');await carregarMidiasPadrao();notif('✅ Atualizado!');};
  $('fabAtualizarApp').onclick=()=>{fecharFab();atualizarAppMagico();};
  $('fabMeuId').onclick=()=>{fecharFab();mostrarMeuId();};
  $('fabLiberar').onclick=()=>{fecharFab();liberarAgora();};
  $('fabQrCode').onclick=()=>{fecharFab();gerarQrCode();};
  $('fabShare').onclick=()=>{
    fecharFab();
    if(navigator.share) navigator.share({title:'VDB MUSIC v62',url:location.href}).catch(()=>{});
    else navigator.clipboard.writeText(location.href).then(()=>notif('📋 Link copiado!'));
  };
  $('fabFeedback').onclick=()=>{
    fecharFab();
    const msg='⭐ *VDB MUSIC v62*\n\nGostaria de deixar meu feedback!';
    window.open('https://wa.me/'+CONFIG.WHATSAPP+'?text='+encodeURIComponent(msg));
  };
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',(e)=>{
    e.preventDefault();
    deferredPrompt=e;
    console.log('📲 PWA instalável!');
  });
  $('fabInstalar').onclick=async()=>{
    fecharFab();
    if(deferredPrompt){
      deferredPrompt.prompt();
      const {outcome}=await deferredPrompt.userChoice;
      if(outcome==='accepted') notif('✅ App instalado!');
      deferredPrompt=null;
    }else{
      const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
      if(isIOS){
        alert('📲 PRA INSTALAR:\n\n1. Toca em "Compartilhar"\n2. "Adicionar à Tela de Início"\n3. Confirma');
      }else{
        alert('📲 PRA INSTALAR:\n\n1. Toca nos 3 pontinhos do Chrome\n2. "Instalar app" ou "Adicionar à tela inicial"\n3. Confirma');
      }
    }
  };
}
function fecharFab(){ $('fabMenu').classList.remove('open'); $('fabMain').classList.remove('open'); }
function ehModoRadio(){ return appState.modoAtual&&appState.modoAtual.indexOf('VDB')>-1; }

async function ativarRadio(){
  notif('🔴 Sintonizando...');
  const generos=['SERTANEJO','FORRÓ','PAGODE','ROMÂNTICA'];
  const todas=[];
  for(const g of generos){
    const m=await buscarGenero(g);
    if(m) todas.push(...m.slice(0,50));
  }
  if(!todas.length){ notif('❌ Erro'); return; }
  appState.musicas=todas;
  appState.modoAtual='RÁDIO VDB';
  appState.playlistAtual=shuffle(todas);
  appState.indiceAtual=0;
  appState.musicasComProblema.clear();
  const mm=appState.playlistAtual[0];
  if(mm){ atualizarLetreiro(mm); atualizarInfoMusica(mm); atualizarCoracao(); }
  notif('🔴 AO VIVO!');
  if(appState.isBackgroundActive) setTimeout(tocar,200);
}
function trocarTema(){
  const keys=Object.keys(TEMAS);
  const i=keys.indexOf(appState.temaCor);
  appState.temaCor=keys[(i+1)%keys.length];
  aplicarTema(appState.temaCor);
  notif('🎨 Tema '+TEMAS[appState.temaCor].nome);
}
function liberarAgora(){
  const senha=prompt('🔑 Digite sua senha:');
  if(!senha) return;
  if(liberarAcesso(senha)) return;
  notif('❌ Inválida!',2000);
}
async function atualizarAppMagico(){
  notif('⏳ Atualizando...',1500);
  try{
    if('caches' in window){
      const k=await caches.keys();
      await Promise.all(k.map(x=>caches.delete(x)));
    }
    if(navigator.serviceWorker){
      const r=await navigator.serviceWorker.getRegistrations();
      await Promise.all(r.map(x=>x.unregister()));
    }
  }catch(e){}
  setTimeout(()=>{ window.location.href=window.location.pathname+'?update='+Date.now(); },800);
}
function gerarQrCode(){
  const url=encodeURIComponent(window.location.href);
  $('qrCodeImage').src='https://api.qrserver.com/v1/create-qr-code/?size=400x400&data='+url;
  $('qrCodeModal').classList.add('active');
}

async function iniciar(){
  try{
    const start=now();
    $('pixValueDisplay').textContent=CONFIG.PIX_DISPLAY;

    /* ⭐ FORÇA ATUALIZAÇÃO SE VERSÃO MUDOU ⭐ */
    const _vSalva=localStorage.getItem('vdb_app_version');
    if(_vSalva!==CONFIG.APP_VERSION){
      if(_vSalva){
        notif('🔄 Atualizando app...',2000);
        try{
          if('caches' in window){
            const ks=await caches.keys();
            await Promise.all(ks.map(k=>caches.delete(k)));
          }
        }catch(e){}
        localStorage.setItem('vdb_app_version',CONFIG.APP_VERSION);
        setTimeout(()=>{
          window.location.href=window.location.pathname+'?v='+CONFIG.APP_VERSION+'&t='+Date.now();
        },500);
        return;
      }
      localStorage.setItem('vdb_app_version',CONFIG.APP_VERSION);
    }

    const r=await verificarTempo();
    if(r.liberado){
      $('blockOverlay').classList.remove('active');
      setTimeout(ativarPlayer,800);
    }else{
      $('idUsuarioBloqueio').textContent=obterMeuId();
      $('blockOverlay').classList.add('active');
    }
    await carregarMidiasPadrao();
    const m=await buscarGenero('BÔNUS');
    if(m&&m.length){
      appState.musicas=m;
      appState.modoAtual='BÔNUS';
      appState.playlistAtual=shuffle(m);
      appState.indiceAtual=0;
      const mm=appState.playlistAtual[0];
      if(mm){ atualizarLetreiro(mm); atualizarInfoMusica(mm); atualizarCoracao(); }
    }
    renderizarGeneros();
    atualizarBadgeFav();
    const dec=now()-start;
    if(dec<CONFIG.LOADING_DURACAO_MS) await sleep(CONFIG.LOADING_DURACAO_MS-dec);
    $('loadingScreen').classList.add('hide');
    $('playerContainer').classList.add('visible');
    await atualizarTimer();
    setTimeout(()=>{ if(!jaFullscreen()) forcarFullscreen(); },300);
    initBusca();
    initFab();
    initAdmin();
    setupCliques();
    $('playBtn').onclick=togglePlay;
    $('prevBtn').onclick=prev;
    $('nextBtn').onclick=next;
    $('btnCoracaoInfo').onclick=(e)=>{e.stopPropagation();vibrar(20);toggleFavAtual();};
    $('letreiroClick').onclick=(e)=>{e.stopPropagation();vibrar();abrirModal('modalBusca');};
    $('barraBuscar').onclick=()=>{vibrar();abrirModal('modalBusca');};
    $('barraFavoritos').onclick=()=>{vibrar();renderFavoritas();abrirModal('modalFavoritas');};
    $('barraGeneros').onclick=()=>{vibrar();renderizarGeneros();abrirModal('modalGeneros');};
    $('fecharBusca').onclick=()=>fecharModal('modalBusca');
    $('fecharFavoritas').onclick=()=>fecharModal('modalFavoritas');
    $('fecharGeneros').onclick=()=>fecharModal('modalGeneros');
    $('fecharMeuId').onclick=()=>fecharModal('modalMeuId');
    $('qrCloseBtn').onclick=()=>$('qrCodeModal').classList.remove('active');
    $('qrCodeModal').onclick=(e)=>{ if(e.target===$('qrCodeModal')) $('qrCodeModal').classList.remove('active'); };
    $('dlCancelar').onclick=()=>{downloadCancelado=true;notif('🛑 Cancelando...',1500);};
    $('dlFechar').onclick=()=>$('downloadModal').classList.remove('active');
    document.querySelectorAll('.modal').forEach(m=>{
      m.onclick=(e)=>{ if(e.target===m) m.classList.remove('open'); };
    });
    $('btnCopiarMeuId').onclick=()=>copiarTexto(obterMeuId(),'📋 ID copiado!');
    $('btnEnviarMeuIdWhats').onclick=enviarMeuIdWhats;
    $('btnCopiarIdBloqueio').onclick=()=>copiarTexto(obterMeuId(),'📋 ID copiado!');
    $('btnEnviarIdWhats').onclick=enviarMeuIdWhats;
    $('btnCopiarPix').onclick=copiarPix;
    $('btnEnviarComprovante').onclick=enviarComprovanteWhats;
    const pb=$('progressBar');
    pb.onclick=(e)=>{
      if(!audio.duration) return;
      const r=pb.getBoundingClientRect();
      audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
    };
    $('btnLiberar').onclick=()=>{
      const s=$('senhaInput').value.trim();
      if(!s){ $('erroSenha').textContent='⚠️ Digite a senha'; return; }
      liberarAcesso(s);
    };
    $('senhaInput').onkeydown=e=>{ if(e.key==='Enter') $('btnLiberar').click(); };
    document.addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT') return;
      if(e.key===' '){ e.preventDefault(); togglePlay(); }
      if(e.key==='ArrowRight') next();
      if(e.key==='ArrowLeft') prev();
    });
    document.addEventListener('touchstart',ativarPlayer,{once:true});
    document.addEventListener('click',ativarPlayer,{once:true});
    setTimeout(()=>{
      if(!appState.isBackgroundActive) notif('👆 TOQUE NA TELA PRA TOCAR',5000);
    },2000);
    audio.ontimeupdate=()=>{
      if(audio.duration){
        $('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';
        $('currentTime').textContent=fmt(audio.currentTime);
        $('totalTime').textContent=fmt(audio.duration);
      }
    };
    audio.onended=()=>{
      if(appState.carregando) return;
      appState.isPlaying=false;
      setTimeout(()=>{ if(!appState.carregando) next(); },200);
    };
    audio.onerror=()=>{
      if(appState.carregando) return;
      if(!audio.src||audio.src===location.href) return;
      const m=appState.playlistAtual[appState.indiceAtual];
      if(m) appState.musicasComProblema.add(m.id);
      falhasConsecutivas++;
      if(falhasConsecutivas>=5){
        falhasConsecutivas=0;
        notif('⚠️ Muitas falhas — pausando',3000);
        return;
      }
      setTimeout(()=>{ if(!appState.carregando) next(); },100);
    };
    audio.oncanplay=()=>{ falhasConsecutivas=0; };
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'){
        if(appState.isBackgroundActive&&appState.isPlaying&&audio.paused&&!appState.carregando){
          audio.play().catch(()=>{});
        }
        document.querySelectorAll('video.active').forEach(v=>{
          if(v.paused&&v.dataset.erro!=='1') v.play().catch(()=>{});
        });
        if(!jaFullscreen()&&appState.playerAtivado) forcarFullscreen();
      }
    });
    window.addEventListener('offline',()=>notif('📴 Sem internet — modo offline'));
    window.addEventListener('online',()=>notif('🌐 Online de novo'));
    setTimeout(agendarCiclo,5000);
    window.addEventListener('beforeunload',()=>{
      if(keepAliveInterval) clearInterval(keepAliveInterval);
      if(fsGuardInterval) clearInterval(fsGuardInterval);
      if(timerInterval) clearInterval(timerInterval);
    });
  }catch(e){
    console.error('❌ Erro:',e);
    $('loadingScreen').classList.add('hide');
    $('playerContainer').classList.add('visible');
  }
}
iniciar();
})();
</script>
