   MÍDIA (vídeos de fundo e anúncio)
   ═══════════════════════════════════════════════════════════ */
const videosAtivos=new Set();
const midiaTokens=new WeakMap(), midiaTimers=new WeakMap();
async function carregarListaMidias(container,urls){
  const tokenAtual=(midiaTokens.get(container)||0)+1; midiaTokens.set(container,tokenAtual); const meuToken=tokenAtual;
  const timerAntigo=midiaTimers.get(container); if(timerAntigo){ clearTimeout(timerAntigo); midiaTimers.delete(container); }
  container.querySelectorAll('video').forEach(v=>{ videosAtivos.delete(v); try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} });
  container.querySelectorAll('video,img').forEach(el=>el.remove());
  if(!urls||!urls.length) return;
  const els=[];
  urls.forEach((src,i)=>{
    const el=document.createElement('video'); el.src=src; el.muted=true; el.loop=false; el.playsInline=true;
    el.setAttribute('playsinline',''); el.setAttribute('muted',''); el.preload='auto';
    el.addEventListener('error',()=>{ el.dataset.erro='1'; });
    el.addEventListener('emptied',()=>{ videosAtivos.delete(el); });
    videosAtivos.add(el); el.className=i===0?'active':'inactive';
    container.appendChild(el); els.push(el);
  });
  let idx=0;
  function proximoIndice(atual){ for(let p=1;p<=els.length;p++){ const prox=(atual+p)%els.length; if(els[prox].dataset.erro!=='1') return prox; } return (atual+1)%els.length; }
  function tocarIdx(n){
    if(meuToken!==midiaTokens.get(container)) return;
    const tAnterior=midiaTimers.get(container); if(tAnterior){ clearTimeout(tAnterior); midiaTimers.delete(container); }
    const el=els[n]; if(!el) return;
    if(el.dataset.erro==='1'){ idx=proximoIndice(n); return tocarIdx(idx); }
    els.forEach((x,j)=>x.classList.toggle('active',j===n));
    els.forEach((x,j)=>{ if(x.tagName==='VIDEO'&&j!==n){ try{ x.pause(); x.currentTime=0; }catch(e){} } });
    try{ el.currentTime=0; }catch(e){}
    const pp=el.play(); if(pp&&pp.catch){ pp.catch(()=>{ el.dataset.erro='1'; setTimeout(()=>{ if(meuToken!==midiaTokens.get(container)) return; idx=proximoIndice(n); tocarIdx(idx); },300); }); }
    el.onended=()=>{ if(meuToken!==midiaTokens.get(container)) return; setTimeout(()=>{ if(meuToken!==midiaTokens.get(container)) return; idx=proximoIndice(n); tocarIdx(idx); },CONFIG.INTERVALO_MIDIA_MS); };
    const t=setTimeout(()=>{ if(meuToken===midiaTokens.get(container)&&idx===n){ idx=proximoIndice(n); tocarIdx(idx); } },CONFIG.MIDIA_MAX_SEGURANCA_MS);
    midiaTimers.set(container,t);
  }
  tocarIdx(0);
}
async function carregarMidiasPadrao(){ await carregarListaMidias($('mediaContainer'),MIDIA_CONFIG.FUNDO_VIDEOS); }

/* ═══════════════════════════════════════════════════════════
   TOQUE NA TELA (1=play, 2=next, 3=prev)
   ═══════════════════════════════════════════════════════════ */
function initTapControls(){
  let tapCount=0, tapTimer=null;
  let startX=0, startY=0, startTime=0, moved=false;
  function mostrarTapFeedback(icone, texto){
    const el=$('tapFeedback'); if(!el) return;
    el.innerHTML='<i class="fas '+icone+'"></i><span>'+texto+'</span>';
    el.classList.add('show');
    clearTimeout(el._hideTimer);
    el._hideTimer=setTimeout(()=>el.classList.remove('show'),700);
  }
  function ehIgnorado(target){
    if(!target) return true;
    const t=target;
    if(['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(t.tagName)) return true;
    if(t.closest('.modal,.fab-menu,.fab-container,.barra-inferior,#adminPanel,#vdbDialogOverlay,#qrCodeModal,#downloadModal,.genre-card,.result-item,.fav-item,.fila-painel,.bf-cta,#tapFeedback,.progress-bar,.letreiro-wrap,.info-topo,.btn-fav-vdb,.titulo-wrap')) return true;
    return false;
  }
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    if(ehIgnorado(e.target)) return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; startTime=Date.now(); moved=false;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(e.touches.length!==1) return;
    const dx=Math.abs(e.touches[0].clientX-startX), dy=Math.abs(e.touches[0].clientY-startY);
    if(dx>15||dy>15) moved=true;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(e.changedTouches.length!==1) return;
    if(ehIgnorado(e.target)) return;
    if(moved) return;
    if(Date.now()-startTime>500) return;
    if(appState.telaAtual!=='principal') return;
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer=setTimeout(()=>{
      const n=tapCount; tapCount=0;
      if(n===1){
        vibrar(15);
        if(audio.paused){ mostrarTapFeedback('fa-play','Play'); togglePlay(); }
        else{ mostrarTapFeedback('fa-pause','Pause'); togglePlay(); }
      } else if(n===2){
        vibrar([15,30,15]); mostrarTapFeedback('fa-forward-step','Próxima'); next();
      } else if(n>=3){
        vibrar([15,30,15,30,15]); mostrarTapFeedback('fa-backward-step','Anterior'); prev();
      }
    }, 280);
  },{passive:true});
  document.addEventListener('click',e=>{
    if(ehIgnorado(e.target)) return;
    if(appState.telaAtual!=='principal') return;
    if('ontouchstart' in window) return;
    vibrar(15);
    if(audio.paused){ mostrarTapFeedback('fa-play','Play'); togglePlay(); }
    else{ mostrarTapFeedback('fa-pause','Pause'); togglePlay(); }
  });
}

/* ═══════════════════════════════════════════════════════════
   SWIPE (esquerda=próxima, direita=anterior)
   ═══════════════════════════════════════════════════════════ */
const SwipeManager = {
  startX:0, startY:0, startTime:0, tracking:false, limiarX:60, limiarTempo:600, ignorar:false,
  init(){ document.addEventListener('touchstart',e=>this.onStart(e),{passive:true}); document.addEventListener('touchend',e=>this.onEnd(e),{passive:true}); document.addEventListener('touchcancel',()=>this.reset(),{passive:true}); },
  onStart(e){ if(!appState.playerAtivado) return; if(e.touches.length!==1) return; const t=e.target; if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(t.tagName)){ this.ignorar=true; return; } if(t.closest('.modal,.fab-menu,.progress-bar,#adminPanel,#vdbDialogOverlay,#qrCodeModal,#downloadModal,.genre-card,.result-item,.fav-item,.fila-painel,.bf-cta,.btn-fav-vdb,.titulo-wrap')){ this.ignorar=true; return; } this.ignorar=false; this.startX=e.touches[0].clientX; this.startY=e.touches[0].clientY; this.startTime=Date.now(); this.tracking=true; },
  onEnd(e){ if(!this.tracking||this.ignorar){ this.reset(); return; } const t=e.changedTouches[0]; const dx=t.clientX-this.startX; const dy=t.clientY-this.startY; const dt=Date.now()-this.startTime; this.reset(); if(dt>this.limiarTempo) return; if(Math.abs(dx)<this.limiarX) return; if(Math.abs(dx)<Math.abs(dy)*1.2) return; if(dx<0) this.onSwipeLeft(); else this.onSwipeRight(); },
  onSwipeLeft(){ vibrar(15); if(appState.telaAtual==='anuncios'||appState.telaAtual==='banner'){ trocarTela('principal'); } else { next(); } },
  onSwipeRight(){ vibrar(15); if(appState.telaAtual==='anuncios'||appState.telaAtual==='banner'){ return; } if(audio.currentTime>3){ audio.currentTime=0; } else { prev(); } },
  reset(){ this.tracking=false; this.ignorar=false; }
};

/* ═══════════════════════════════════════════════════════════
   FULLSCREEN
   ═══════════════════════════════════════════════════════════ */
let fsEmAndamento=false, fsRetryTimer=null;
function jaFullscreen(){ return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement); }
function forcarFullscreen(){
  if(jaFullscreen()) return true;
  if(fsEmAndamento) return false;
  fsEmAndamento=true;
  try{
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(req){ const r=req.call(el,{navigationUI:'hide'}); if(r&&r.then){ r.then(()=>{ fsEmAndamento=false; }).catch(()=>{ fsEmAndamento=false; }); } else fsEmAndamento=false; return true; }
    fsEmAndamento=false; return false;
  }catch(e){ fsEmAndamento=false; return false; }
}
function iniciarFullscreenRetry(){
  if(fsRetryTimer) clearInterval(fsRetryTimer);
  fsRetryTimer=setInterval(()=>{ if(!appState.playerAtivado) return; if(jaFullscreen()) return; forcarFullscreen(); },2000);
}
document.addEventListener('fullscreenchange',()=>{ fsEmAndamento=false; });
document.addEventListener('webkitfullscreenchange',()=>{ fsEmAndamento=false; });

let silentUrl=null;
function criarSilentAudio(){ const sr=44100,ns=sr; const b=new ArrayBuffer(44+ns*2); const v=new DataView(b); const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); }; w(0,'RIFF'); v.setUint32(4,36+ns*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,ns*2,true); return new Blob([b],{type:'audio/wav'}); }
function getSilentUrl(){ if(!silentUrl) silentUrl=URL.createObjectURL(criarSilentAudio()); return silentUrl; }
let keepAliveInterval=null;
function manterAtivo(){ if(keepAliveInterval) clearInterval(keepAliveInterval); keepAliveInterval=setInterval(()=>{ if(!appState.isBackgroundActive) return; try{ const bg=$('backgroundAudio'); if(bg.paused) bg.play().catch(()=>{}); }catch(e){} },3000); }
async function ativarPlayer(){
  if(appState.playerAtivado||appState.introAtiva) return;
  appState.playerAtivado=true;
  try{ const bg=$('backgroundAudio'); bg.src=getSilentUrl(); bg.loop=true; bg.volume=0.001; await bg.play(); appState.isBackgroundActive=true; manterAtivo(); }catch(e){ appState.isBackgroundActive=true; }
  forcarFullscreen();
  iniciarFullscreenRetry();
  registrarMediaSessionHandlers();
  await iniciarTimer();
  setTimeout(tocar,500);
  setTimeout(()=>{ if(!appState.isPlaying && appState.musicas.length && !appState.carregando){ tocar(); } },2500);
}

/* ═══════════════════════════════════════════════════════════
   FAB (menu +)
   ═══════════════════════════════════════════════════════════ */
function fecharFab(){ const m=$('fabMenu'), f=$('fabMain'); if(m) m.classList.remove('open'); if(f) f.classList.remove('open'); }
async function ativarMix(){
  notif('🔀 Misturando...');
  const todas=[];
  for(const g of CONFIG.MIX_GENEROS){ const m=await buscarGenero(g); if(m) todas.push(...m.slice(0,50)); }
  if(!todas.length){ notif('❌ Erro',3000,true); return; }
  appState.musicas=todas; appState.modoAtual='MISTURA'; appState.isRadio=true; appState.musicasComProblema.clear(); appState.falhasConsecutivas=0;
  FilaInteligente.resetar(todas,'MISTURA'); appState.musicaAtual=null;
  const mm=FilaInteligente.proxima(); if(mm){ appState.musicaAtual=mm; atualizarLetreiro(mm); atualizarInfoMusica(mm); atualizarCoracao(); }
  if(typeof filaAberta!=='undefined'&&filaAberta) renderizarFila();
  notif('🔀 Mistura ativa!');
  if(appState.isBackgroundActive) setTimeout(tocar,200);
}
function trocarTema(){ const temas={azul:{nome:'Azul',c1:'#2563eb',c2:'#1e40af',c3:'#3b82f6'},roxo:{nome:'Roxo',c1:'#7c3aed',c2:'#5b21b6',c3:'#a855f7'},preto:{nome:'Preto',c1:'#374151',c2:'#111827',c3:'#6b7280'}}; const keys=Object.keys(temas); const cur=localStorage.getItem('vdb_tema_cor')||'azul'; const i=keys.indexOf(cur); const next=keys[(i+1)%keys.length]; const t=temas[next]; document.documentElement.style.setProperty('--cor-1',t.c1); document.documentElement.style.setProperty('--cor-2',t.c2); document.documentElement.style.setProperty('--cor-3',t.c3); try{ localStorage.setItem('vdb_tema_cor',next); }catch(e){} notif('🎨 Tema '+t.nome); }
async function atualizarAppMagico(){ notif('⏳ Atualizando...',1500); try{ if('caches' in window){ const k=await caches.keys(); await Promise.all(k.filter(n=>!n.startsWith('vdb-offline')).map(x=>caches.delete(x))); } if(navigator.serviceWorker){ const r=await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); } }catch(e){} setTimeout(()=>{ const u=new URL(window.location.href); u.searchParams.set('update',Date.now()); window.location.href=u.toString(); },800); }
function abrirYouTubeMusic(){ vibrar(15); const m = appState.musicaAtual; const q = m ? encodeURIComponent((m.title||'')+' '+(m.artist||'')) : ''; const url = q ? 'https://music.youtube.com/search?q='+q : 'https://music.youtube.com/'; window.open(url,'_blank','noopener,noreferrer'); }
function initFab(){
  const main=$('fabMain'), menu=$('fabMenu');
  if(!main||!menu) return;
  main.onclick=e=>{ e.stopPropagation(); vibrar(); const o=menu.classList.toggle('open'); main.classList.toggle('open',o); };
  document.addEventListener('click',e=>{ if(menu.classList.contains('open')&&!menu.contains(e.target)&&e.target!==main&&!main.contains(e.target)) fecharFab(); });
  $('fabSite').onclick=()=>{ fecharFab(); vibrar(15); if(MIDIA_CONFIG.LINK_SITE) window.open(MIDIA_CONFIG.LINK_SITE,'_blank','noopener,noreferrer'); else notif('🌐 Link do site não configurado',2000); };
  $('fabYTMusic').onclick=()=>{ fecharFab(); abrirYouTubeMusic(); };
  $('fabMix').onclick=()=>{ fecharFab(); ativarMix(); };
  $('fabBaixarAtual').onclick=()=>{ fecharFab(); if(appState.isRadio){ notif('⚠️ Escolha um gênero primeiro'); return; } iniciarDownloadGenero(appState.modoAtual); };
  $('fabGerenciarOffline').onclick=()=>{ fecharFab(); abrirGerenciadorOffline(); };
  $('fabTemas').onclick=()=>{ fecharFab(); trocarTema(); };
  $('fabFullscreen').onclick=()=>{ fecharFab(); forcarFullscreen(); notif('🖥️ Tela cheia'); };
  $('fabSleep').onclick=async()=>{ fecharFab(); const m=await vdbDialog({title:'⏰ SLEEP TIMER',msg:'Desligar em quantos minutos?',input:'number',placeholder:'15',okText:'Ativar'}); const mins=parseInt(m); if(mins>0){ clearTimeout(appState.sleepTimerId); appState.sleepTimerId=setTimeout(()=>{ audio.pause(); appState.isPlaying=false; $('playBtn').innerHTML='<i class="fas fa-play"></i>'; notif('💤 Sleep timer',4000); },mins*60000); notif('⏰ Sleep: '+mins+' min'); } };
  $('fabRecarregar').onclick=()=>{ fecharFab(); location.reload(); };
  $('fabAtualizarMidia').onclick=async()=>{ fecharFab(); notif('🔄 Atualizando...'); await carregarMidiasPadrao(); notif('✅ Atualizado!'); };
  $('fabAtualizarApp').onclick=()=>{ fecharFab(); atualizarAppMagico(); };
  $('fabMeuId').onclick=()=>{ fecharFab(); mostrarMeuId(); };
  $('fabLiberar').onclick=()=>{ fecharFab(); liberarAgora(); };
  $('fabQrCode').onclick=()=>{ fecharFab(); gerarQrCode(); };
  $('fabShare').onclick=()=>{ fecharFab(); if(navigator.share) navigator.share({title:'VDB MUSIC '+VERSAO,url:location.href}).catch(()=>{}); else navigator.clipboard.writeText(location.href).then(()=>notif('📋 Link copiado!')); };
  $('fabFeedback').onclick=async()=>{ fecharFab(); const nota=await vdbDialog({title:'⭐ FEEDBACK',msg:'De 1 a 5, como avalia o app?',input:'number',placeholder:'5',okText:'Enviar'}); if(!nota) return; const msg='⭐ *VDB MUSIC '+VERSAO+'*\n\nNota: '+nota+'/5'; window.open('https://wa.me/'+CONFIG.WHATSAPP+'?text='+encodeURIComponent(msg)); };
  $('fabInstalar').onclick=()=>{ fecharFab(); acionarInstalacaoPWA(); };
}

/* ═══════════════════════════════════════════════════════════
   FILA (painel)
   ═══════════════════════════════════════════════════════════ */
function renderizarFila(){
  const lista=$('filaLista'), info=$('filaInfo'); if(!lista) return;
  const todas=[...FilaInteligente.historico, ...FilaInteligente.fila];
  const atual=appState.musicaAtual;
  if(!todas.length){ lista.innerHTML='<div class="fila-vazio">🎵 Nenhuma música na fila<br><br>Escolha um gênero pra começar</div>'; if(info) info.textContent='0 músicas'; return; }
  if(info) info.textContent=todas.length+' música'+(todas.length>1?'s':'');
  lista.innerHTML='';
  const frag=document.createDocumentFragment();
  todas.slice(0,100).forEach((m,i)=>{
    const isTocando=atual&&atual.id===m.id;
    const item=document.createElement('div'); item.className='fila-item'+(isTocando?' tocando':'');
    item.innerHTML='<div class="num">'+(isTocando?'▶':String(i+1).padStart(2,'0'))+'</div>' +
      '<div class="info-fila"><span class="titulo-fila">'+sanitize(m.title||'Sem título')+'</span>' +
      '<span class="artista-fila">'+sanitize(m.artist||'Artista')+'</span></div>' +
      (isTocando?'<i class="fas fa-volume-up play-ind"></i>':'');
    item.onclick=()=>{ if(isTocando) return; vibrar(15); appState._forcarMusica=m; if(appState.isBackgroundActive) tocar(); fecharFila(); notif('🎵 '+(m.title||'').slice(0,30),1500); };
    frag.appendChild(item);
  });
  lista.appendChild(frag);
}
let filaAberta=false;
function abrirFila(){ const p=$('filaPainel'); if(!p) return; renderizarFila(); p.classList.add('show'); filaAberta=true; }
function fecharFila(){ const p=$('filaPainel'); if(!p) return; p.classList.remove('show'); filaAberta=false; }
function toggleFila(){ if(filaAberta) fecharFila(); else abrirFila(); }

/* ═══════════════════════════════════════════════════════════
   PROGRESSO (barra oculta, mas funcional)
   ═══════════════════════════════════════════════════════════ */
function setupProgressBar(){
  const bar=$('progressBar'); if(!bar) return;
  let scrubbing=false;
  function seekTo(e){ if(!audio.duration||!isFinite(audio.duration)) return; const r=bar.getBoundingClientRect(); const x=Math.max(0,Math.min(e.clientX-r.left,r.width)); const pct=x/r.width; audio.currentTime=pct*audio.duration; $('progressFill').style.width=(pct*100)+'%'; $('currentTime').textContent=fmt(audio.currentTime); }
  bar.addEventListener('pointerdown',e=>{ e.preventDefault(); scrubbing=true; try{ bar.setPointerCapture(e.pointerId); }catch(_){} seekTo(e); });
  bar.addEventListener('pointermove',e=>{ if(scrubbing) seekTo(e); });
  bar.addEventListener('pointerup',e=>{ scrubbing=false; try{ bar.releasePointerCapture(e.pointerId); }catch(_){} });
  bar.addEventListener('pointercancel',()=>{ scrubbing=false; });
}

/* ═══════════════════════════════════════════════════════════
   INICIAR TUDO
   ═══════════════════════════════════════════════════════════ */
async function iniciar(){
  try{
    const start=Date.now();
    if($('loadingVersion')) $('loadingVersion').textContent=VERSAO;
    if($('fabVersao')) $('fabVersao').textContent=VERSAO;
    document.title='VDB MUSIC '+VERSAO;
    if($('scrollText')) $('scrollText').textContent='🎵 VDB MUSIC '+VERSAO+' 🎵';

    if(navigator.storage&&navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(_){} }
    try{ appState.fingerprint=await gerarFingerprintReal(); }catch(e){ appState.fingerprint=btoa(navigator.userAgent).slice(0,32); }
    appState.favorites=appState.favorites.map(f=>({...f,repo:f.repo||GENRE_REPOS[f.genero]||'radiolojasjc-hub/play12'}));

    const r=await SecureTimer.verificar();
    if(r.liberado){ $('blockOverlay').classList.remove('active'); }
    else{ $('idUsuarioBloqueio').textContent=appState.fingerprint; $('blockOverlay').classList.add('active'); }

    const introPromessa=rodarIntro();
    const [_,m]=await Promise.all([carregarMidiasPadrao(), buscarGenero('BÔNUS')]);
    if(m&&m.length){ appState.musicas=m; appState.modoAtual='BÔNUS'; appState.musicasComProblema.clear(); FilaInteligente.resetar(m,'BÔNUS'); appState.musicaAtual=null; const mm=FilaInteligente.proxima(); if(mm){ appState.musicaAtual=mm; atualizarLetreiro(mm); atualizarInfoMusica(mm); atualizarCoracao(); } }
    renderizarGeneros(true);
    atualizarBadgeFav();

    const introOk=await introPromessa;
    if(!introOk){ const dec=Date.now()-start; if(dec<CONFIG.LOADING_MIN_MS) await sleep(CONFIG.LOADING_MIN_MS-dec); }
    $('loadingScreen').classList.add('hide');
    $('playerContainer').classList.add('visible');
    await atualizarTimer();
    setTimeout(()=>{ if(!jaFullscreen()) forcarFullscreen(); },300);

    SearchManager.init();
    initFab();
    initValidadeSeletor();
    initAdmin();
    setupCliques();
    SwipeManager.init();
    setupProgressBar();
    initTapControls();

    /* Botões */
    $('playBtn').onclick=togglePlay;
    $('prevBtn').onclick=prev;
    $('nextBtn').onclick=next;
    $('btnCoracaoInfo').onclick=e=>{ e.stopPropagation(); vibrar(20); toggleFavAtual(); };
    $('btnFavVDB').onclick=e=>{ e.stopPropagation(); vibrar(20); toggleFavAtual(); };
    $('letreiroClick').onclick=e=>{ e.stopPropagation(); vibrar(); SearchManager.abrir(); };
    $('barraBuscar').onclick=()=>{ vibrar(); SearchManager.abrir(); };
    $('barraFavoritos').onclick=()=>{ vibrar(); renderFavoritas(); abrirModal('modalFavoritas'); };
    $('barraGeneros').onclick=()=>{ vibrar(); renderizarGeneros(); abrirModal('modalGeneros'); };
    $('barraYTMusic').onclick=()=>{ vibrar(); abrirYouTubeMusic(); };
    $('barraFila').onclick=()=>{ vibrar(); toggleFila(); };
    $('filaFecharBtn').onclick=()=>fecharFila();
    $('fecharFavoritas').onclick=()=>fecharModal('modalFavoritas');
    $('fecharGeneros').onclick=()=>fecharModal('modalGeneros');
    $('fecharMeuId').onclick=()=>fecharModal('modalMeuId');
    $('qrCloseBtn').onclick=()=>$('qrCodeModal').classList.remove('active');
    $('qrCodeModal').onclick=e=>{ if(e.target===$('qrCodeModal')) $('qrCodeModal').classList.remove('active'); };
    $('dlCancelar').onclick=()=>{ downloadCancelado=true; notif('🛑 Cancelando...',1500); };
    $('dlFechar').onclick=()=>$('downloadModal').classList.remove('active');
    $('btnCopiarMeuId').onclick=()=>copiarTexto(appState.fingerprint,'📋 ID copiado!');
    $('btnEnviarMeuIdWhats').onclick=enviarMeuIdWhats;
    $('btnCopiarIdBloqueio').onclick=()=>copiarTexto(appState.fingerprint,'📋 ID copiado!');
    $('btnEnviarIdWhats').onclick=enviarMeuIdWhats;
    ['modalFavoritas','modalGeneros','modalMeuId'].forEach(id=>{ const modal=$(id); if(modal) modal.addEventListener('click',e=>{ if(e.target===modal) fecharModal(id); }); });
    $('btnLiberar').onclick=()=>{ const s=$('senhaInput').value.trim(); if(!s){ $('erroSenha').textContent='⚠️ Digite a senha'; return; } liberarAcesso(s); };
    $('senhaInput').onkeydown=e=>{ if(e.key==='Enter') $('btnLiberar').click(); };

    document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key===' '){ e.preventDefault(); togglePlay(); } if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key==='f'||e.key==='F'){ forcarFullscreen(); } });
    document.addEventListener('touchstart',ativarPlayer,{once:true});
    document.addEventListener('click',ativarPlayer,{once:true});
    setTimeout(()=>{ if(!appState.playerAtivado){ ativarPlayer(); } },1500);

    /* ★ áudio: progresso + erro com notif */
    audio.ontimeupdate=()=>{
      if(audio.duration&&isFinite(audio.duration)){
        const pct=(audio.currentTime/audio.duration*100);
        $('progressFill').style.width=pct+'%';
        $('miniProgressFill').style.width=pct+'%';
        $('currentTime').textContent=fmt(audio.currentTime);
        $('totalTime').textContent=fmt(audio.duration);
      }
    };
    audio.onplay=()=>{ appState.falhasConsecutivas=0; if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; };
    audio.onpause=()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; };
    audio.onended=()=>{ if(appState.carregando) return; appState.isPlaying=false; setTimeout(()=>{ if(!appState.carregando) next(); },200); };
    audio.onerror=()=>{
      if(appState.carregando) return;
      if(!audio.currentSrc||audio.currentSrc===location.href) return;
      const m=appState.musicaAtual;
      if(m){ appState.musicasComProblema.add(m.id); notif('⚠️ Não carregou: '+(m.title||'').slice(0,25), 1800); }
      setTimeout(()=>{ if(!appState.carregando) next(); }, 300);
    };

    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'){
        if(appState.isBackgroundActive&&appState.isPlaying&&audio.paused&&!appState.carregando) audio.play().catch(()=>{});
        videosAtivos.forEach(v=>{ if(v.classList.contains('active')&&v.paused&&v.dataset.erro!=='1') v.play().catch(()=>{}); });
        if(!jaFullscreen()&&appState.playerAtivado) forcarFullscreen();
        if(appState.isPlaying) WakeLockManager.ativar();
        if(appState.playerAtivado) agendarCiclo();
      }
    });

    if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}); }); }
    setTimeout(mostrarBotaoInstalar,2500);
    setTimeout(agendarCiclo,5000);

    if(!appState.introAtiva){ setTimeout(ativarPlayer,800); }
    else{ const check=setInterval(()=>{ if(!appState.introAtiva){ clearInterval(check); setTimeout(ativarPlayer,500); } },200); }

    window.addEventListener('beforeunload',()=>{ if(keepAliveInterval) clearInterval(keepAliveInterval); if(fsRetryTimer) clearInterval(fsRetryTimer); if(silentUrl){ try{ URL.revokeObjectURL(silentUrl); }catch(_){} silentUrl=null; } });
  }catch(e){
    $('loadingScreen').classList.add('hide');
    $('playerContainer').classList.add('visible');
    appState.introAtiva=false;
  }
}

iniciar();
})();
</script>
