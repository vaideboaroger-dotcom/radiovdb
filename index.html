html,body{height:100dvh;width:100%;background:#000;color:#fff;overflow:hidden;position:fixed;top:0;left:0}

</style>
</head>

<script>(function(){
'use strict';

/* ============================================================
   ⚙️ CONFIGURAÇÃO — EDITE SÓ AQUI
   ============================================================ */
const TEMPO_TESTE_MINUTOS = 1440; // 1440=1dia | 60=1h | 5=5min | 10080=7dias
const WHATSAPP = '5512988461978';
const VERSAO = 'v013';
/* ============================================================ */

const $ = id => document.getElementById(id);
const fmt = s => { if(!s||isNaN(s)) return '0:00'; const m=Math.floor(s/60), g=Math.floor(s%60); return m+':'+(g<10?'0':'')+g; };
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const shuffle = a => { const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; };

function fmtTempo(s){
  if(s<0) s=0;
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), g=Math.floor(s%60);
  if(d>0) return d+'d '+h+'h';
  if(h>0) return h+'h '+m+'m';
  return m+'m '+g+'s';
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), 2500);
}

function copiar(txt){
  if(!txt){ toast('⚠️ Nada'); return; }
  navigator.clipboard.writeText(txt).then(()=>toast('📋 Copiado!')).catch(()=>{
    const i=document.createElement('input'); i.value=txt; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); toast('📋 Copiado!');
  });
}

/* ============================================================
   🔐 SISTEMA DE LICENÇA — NÃO MEXA
   ============================================================ */
const SEC_KEY = 'vdb_p4rt3_a8f3c9e2_x0z7y6w5_k9j8h7g6_q1w2e3r4_t5y6u7i8';

async function sha(txt){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(let i=0;i<txt.length;i++){ h=((h<<5)-h)+txt.charCodeAt(i); h|=0; }
    return (Math.abs(h).toString(16)+'0000000000000000').slice(0,32);
  }
}

async function hmac(txt){
  try{
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(SEC_KEY), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const s = await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(txt));
    return btoa(String.fromCharCode(...new Uint8Array(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  }catch(e){ return await sha(txt+SEC_KEY); }
}

async function fp(){
  const p = [];
  try{ p.push(navigator.userAgent||'', navigator.language||'', screen.width+'x'+screen.height, new Date().getTimezoneOffset(), navigator.hardwareConcurrency||0, navigator.platform||''); }catch(e){}
  try{
    const c = document.createElement('canvas'); c.width=120; c.height=40;
    const x = c.getContext('2d'); x.font='14px Arial';
    x.fillStyle='#f60'; x.fillRect(50,0,60,20);
    x.fillStyle='#069'; x.fillText('VDB',0,15);
    p.push(c.toDataURL().slice(-48));
  }catch(e){}
  return (await sha(p.join('|'))).slice(0,16);
}

async function gerarLic(tipo, dias, device){
  const exp = tipo==='lifetime' ? 'NEVER' : String(Date.now()+dias*86400000);
  const f = device || 'ANY';
  const n = Math.random().toString(36).slice(2,10);
  const payload = 'v3|'+tipo+'|'+exp+'|'+f+'|'+n;
  const sig = await hmac(payload);
  return 'VDB3.' + btoa(payload).replace(/=/g,'') + '.' + sig;
}

async function validarLic(lic){
  if(!lic) return {ok:false, motivo:'vazia'};
  lic = lic.trim().replace(/^["']|["']$/g,'');
  if(!lic.startsWith('VDB3.')) return {ok:false, motivo:'formato'};
  const p = lic.split('.');
  if(p.length !== 3) return {ok:false, motivo:'formato'};
  let payload;
  try{
    const pad = p[1].length%4;
    payload = atob(pad ? p[1]+'='.repeat(4-pad) : p[1]);
  }catch(e){ return {ok:false, motivo:'payload'}; }
  const esp = await hmac(payload);
  if(p[2] !== esp) return {ok:false, motivo:'assinatura'};
  const c = payload.split('|');
  if(c.length !== 5 || c[0] !== 'v3') return {ok:false, motivo:'campos'};
  const [,tipo,expTs,fpVal] = c;
  if(expTs !== 'NEVER'){
    const exp = parseInt(expTs,10);
    if(Date.now() > exp) return {ok:false, motivo:'expirada', exp};
  }
  if(fpVal !== 'ANY'){
    const meu = await fp();
    if(meu !== fpVal) return {ok:false, motivo:'outro_device'};
  }
  return {ok:true, tipo, exp: expTs==='NEVER' ? Infinity : parseInt(expTs,10)};
}

async function enc(txt){ const f = await fp(); return btoa(unescape(encodeURIComponent(f+'|'+txt))); }
async function dec(s){
  try{
    const full = decodeURIComponent(escape(atob(s)));
    const i = full.indexOf('|');
    if(i < 0) return null;
    const f = await fp();
    if(full.slice(0,i) !== f) return null;
    return full.slice(i+1);
  }catch(e){ return null; }
}

async function salvarLic(l){ localStorage.setItem('vdb_lic', await enc(l)); }
async function lerLic(){ const e = localStorage.getItem('vdb_lic'); return e ? await dec(e) : null; }
async function limparLic(){ localStorage.removeItem('vdb_lic'); }

async function trialAtivo(){
  let info;
  const e = localStorage.getItem('vdb_trial');
  if(!e){
    info = {inicio: Date.now()};
    localStorage.setItem('vdb_trial', await enc(JSON.stringify(info)));
  } else {
    const d = await dec(e);
    if(!d) return {ativo:false};
    try{ info = JSON.parse(d); }catch(err){ return {ativo:false}; }
  }
  const exp = info.inicio + (TEMPO_TESTE_MINUTOS*60*1000);
  if(Date.now() > exp) return {ativo:false, exp};
  return {ativo:true, exp};
}

async function verificarAcesso(){
  const lic = await lerLic();
  if(lic){
    const r = await validarLic(lic);
    if(r.ok) return {ok:true, tipo:r.tipo, exp:r.exp};
    await limparLic();
  }
  const t = await trialAtivo();
  if(t.ativo) return {ok:true, tipo:'trial', exp:t.exp};
  return {ok:false};
}

/* ============================================================
   🎵 GÊNEROS
   ============================================================ */
const GENEROS = {
  'BÔNUS': 'radiolojasjc-hub/play12/play.json',
  'FLASHBACK': 'radiolojasjc-hub/flashbacktop/flashback.json',
  'RELIGIOSA': 'radiolojasjc-hub/religiosa/religiosa.json',
  'ROMÂNTICA': 'radiolojasjc-hub/romanticatop/romantica.json',
  'MPB': 'radiolojasjc-hub/mpbtop/mpb.json',
  'POP/MIX': 'radiolojasjc-hub/poptop/pop.json',
  'SERTANEJO': 'radiolojasjc-hub/sertanejo/sertanejo.json',
  'FORRÓ': 'radiolojasjc-hub/forrodez/forrodez.json',
  'SAMBA': 'radiolojasjc-hub/sambatop/samba.json',
  'BREGA': 'radiolojasjc-hub/bregatop/brega.json',
  'REGGAE': 'radiolojasjc-hub/reggaetop/reggae.json',
  'MODA RAIZ': 'radiolojasjc-hub/modatop/moda.json',
  'FUNK': 'radiolojasjc-hub/fank/fank.json',
  'MODÃO SERTANEJO': 'radiolojasjc-hub/modasertaneja/modaosert.json',
  'ROCK': 'radiolojasjc-hub/rock/rock.json',
  'NOVIDADES': 'radiolojasjc-hub/VDB/novidades.json',
  'PAGODE': 'radiolojasjc-hub/sambatop/pagode.json',
  'BAILÃO': 'radiolojasjc-hub/forrodez/bailão.json',
  'SERESTA': 'radiolojasjc-hub/sertanejo/seresta.json',

  'FORRÓ RAIZ': 'radiolojasjc-hub/forroraiz/forroraiz.json',
  'MISTURA BRASIL': 'radiolojasjc-hub/listtop/misturabrasil.json',
  'DISCO MUSIC': 'vaideboaroger-dotcom/vdb/discomusic.json'
};
const ORDEM = Object.keys(GENEROS);

const cache = new Map();

async function buscarGenero(g){
  if(cache.has(g)) return cache.get(g);
  try{
    const url = 'https://raw.githubusercontent.com/' + GENEROS[g] + '/refs/heads/main/' + GENEROS[g].split('/').pop();
    // tenta URL direta primeiro
    let urlFinal = 'https://raw.githubusercontent.com/' + GENEROS[g];
    const r = await fetch(urlFinal);
    if(!r.ok) throw new Error('erro');
    const j = await r.json();
    const lista = Array.isArray(j) ? j : (j.musicas || []);
    const ms = lista.filter(m => m && m.src && m.title).map(m => ({
      title: m.title,
      artist: m.artist || 'Artista',
      src: m.src,
      genero: g,
      repo: GENEROS[g].split('/')[0] + '/' + GENEROS[g].split('/')[1]
    }));
    cache.set(g, ms);
    return ms;
  }catch(e){
    return null;
  }
}

function getUrlMusica(m){
  if(!m || !m.src) return null;
  const s = String(m.src).trim();
  if(/^https?:\/\//i.test(s)) return s;
  const nome = s.replace(/^\.\//,'').replace(/^\//,'');
  const partes = (m.repo || GENEROS[m.genero] || 'radiolojasjc-hub/play12').split('/');
  const repoPath = partes[0] + '/' + partes[1];
  return 'https://raw.githubusercontent.com/' + repoPath + '/refs/heads/main/' + encodeURIComponent(nome);
}

/* ============================================================
   📦 ESTADO
   ============================================================ */
const state = {
  musicas: [],
  atual: null,
  favs: [],
  volume: 1,
  fila: [],
  historico: [],
  modoAtual: 'BÔNUS',
  fingerprint: ''
};

try{ state.favs = JSON.parse(localStorage.getItem('vdb_favs')||'[]'); }catch(e){ state.favs = []; }
try{ const v = parseFloat(localStorage.getItem('vdb_vol')); if(!isNaN(v) && v>=0 && v<=1) state.volume = v; }catch(e){}

const audio = $('player');

/* ============================================================
   ▶️ PLAYER
   ============================================================ */
async function tocar(){
  if(!state.musicas.length){ toast('Escolha um gênero'); return; }

  let m = state.fila.shift();
  if(!m){
    state.fila = shuffle(state.musicas);
    m = state.fila.shift();
  }
  if(!m) return;

  state.atual = m;
  $('letreiro').textContent = '🎵 ' + m.title + ' — ' + m.artist;
  $('generoNome').textContent = (m.genero || 'VDB').toUpperCase();
  $('play').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

  const url = getUrlMusica(m);
  if(!url){ toast('URL inválida'); next(); return; }

  try{
    audio.src = url;
    audio.volume = state.volume;
    await audio.play();
    $('play').innerHTML = '<i class="fas fa-pause"></i>';
    state.historico.push(m);
    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.metadata = new MediaMetadata({
          title: m.title || 'VDB',
          artist: m.artist || 'Artista',
          album: m.genero || 'Música'
        });
      }catch(e){}
    }
  }catch(e){
    toast('Não carregou: ' + m.title.slice(0,20));
    $('play').innerHTML = '<i class="fas fa-play"></i>';
    setTimeout(next, 500);
  }
}

function next(){
  if(!state.musicas.length) return;
  tocar();
}

function prev(){
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  if(state.historico.length >= 2){
    state.historico.pop();
    const ant = state.historico.pop();
    if(ant) state.fila.unshift(ant);
  }
  tocar();
}

async function togglePlay(){
  if(!state.atual){ tocar(); return; }
  if(audio.paused){
    try{ await audio.play(); $('play').innerHTML='<i class="fas fa-pause"></i>'; }catch(e){}
  } else {
    audio.pause();
    $('play').innerHTML='<i class="fas fa-play"></i>';
  }
}

/* ============================================================
   ⏰ TIMER
   ============================================================ */
let timerInterval = null;

async function atualizarTimer(){
  const lic = await lerLic();
  if(lic){
    const r = await validarLic(lic);
    if(r.ok){
      if(r.exp === Infinity){
        $('timer').innerHTML = '<i class="fas fa-check-circle"></i> VITALÍCIO';
      } else {
        const rest = Math.max(0, Math.floor((r.exp - Date.now())/1000));
        $('timer').innerHTML = '<i class="fas fa-check-circle"></i> ' + fmtTempo(rest);
      }
      $('timer').className = 'ok';
      return;
    }
  }
  const t = await trialAtivo();
  if(!t.ativo){
    $('timer').innerHTML = '<i class="fas fa-lock"></i> BLOQUEADO';
    $('timer').className = 'block';
    return;
  }
  const rest = Math.max(0, Math.floor((t.exp - Date.now())/1000));
  $('timer').innerHTML = '<i class="fas fa-clock"></i> ' + fmtTempo(rest);
  $('timer').className = 'warn';
}

async function iniciarTimer(){
  const a = await verificarAcesso();
  if(!a.ok){ bloquear(); return; }
  await atualizarTimer();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(async()=>{
    if(document.hidden) return;
    const a2 = await verificarAcesso();
    if(!a2.ok){ clearInterval(timerInterval); bloquear(); return; }
    await atualizarTimer();
  }, 5000);
}

async function bloquear(){
  state.fingerprint = await fp();
  $('meuId').textContent = state.fingerprint;
  $('bloqueio').classList.add('on');
  audio.pause();
  $('play').innerHTML = '<i class="fas fa-play"></i>';
}

async function liberar(){
  const lic = $('inputLicenca').value.trim();
  if(!lic){ $('erro').textContent = '⚠️ Cole sua licença'; return; }
  const r = await validarLic(lic);
  if(r.ok){
    await salvarLic(lic);
    $('bloqueio').classList.remove('on');
    $('erro').textContent = '';
    $('inputLicenca').value = '';
    toast('✅ Liberado!');
    await atualizarTimer();
    return true;
  }
  const motivos = {
    'expirada': '⏰ Licença expirada',
    'assinatura': '🔒 Inválida',
    'outro_device': '📱 Licença de outro celular',
    'formato': '❌ Formato inválido',
    'payload': '❌ Corrompida'
  };
  $('erro').textContent = motivos[r.motivo] || '❌ Inválida';
  return false;
}

/* ============================================================
   👑 ADMIN
   ============================================================ */
let validadeSel = 7;
let cliques = [];

function setupAdmin(){
  $('titulo').addEventListener('click', () => {
    const t = Date.now();
    cliques = cliques.filter(x => t-x < 3000);
    cliques.push(t);
    if(cliques.length >= 8){
      cliques = [];
      $('admin').classList.add('on');
    }
  });

  document.querySelectorAll('#admin .dias button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#admin .dias button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      validadeSel = parseInt(b.dataset.d);
    };
  });

  $('gerarUniv').onclick = async () => {
    const tipo = validadeSel === 0 ? 'lifetime' : 'trial';
    const dias = validadeSel === 0 ? 3650 : validadeSel;
    const lic = await gerarLic(tipo, dias);
    $('licenca').value = lic;
    toast('✅ Universal gerada!');
  };

  $('gerarDev').onclick = async () => {
    const id = $('adminId').value.trim();
    if(!id || id.length < 10){ toast('⚠️ Cole o ID do cliente'); return; }
    const tipo = validadeSel === 0 ? 'lifetime' : 'trial';

    const lic = await gerarLic(tipo, dias, id);
    $('licenca').value = lic;
    toast('📱 Device gerada!');
  };

  $('btnCopiar').onclick = () => copiar($('licenca').value);
  $('btnWpp').onclick = () => {
    const v = $('licenca').value;
    if(!v){ toast('Gere uma primeiro'); return; }
    window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('🔑 Licença VDB:\n\n' + v));
  };
  $('btnFechar').onclick = () => $('admin').classList.remove('on');
}

/* ============================================================
   🔍 BUSCA
   ============================================================ */
function initBusca(){
  $('btnBuscar').onclick = () => {
    $('modalBusca').classList.add('on');
    setTimeout(() => $('inputBusca').focus(), 200);
  };
  $('fecharBusca').onclick = () => $('modalBusca').classList.remove('on');

  let timeout = null;
  $('inputBusca').addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(filtrar, 300);
  });

  async function filtrar(){
    const termo = norm($('inputBusca').value);
    const box = $('resultadoBusca');
    if(!termo){ box.innerHTML = '<div style="text-align:center;padding:30px;opacity:.5">Digite algo...</div>'; return; }

    box.innerHTML = '<div style="text-align:center;padding:30px;opacity:.5">🔄 Buscando...</div>';

    // Carrega todos os gêneros se ainda não carregou
    const todas = [...state.musicas];
    for(const g of ORDEM){
      if(g === state.modoAtual) continue;
      const ms = cache.get(g);
      if(ms) todas.push(...ms);
    }

    const res = todas.filter(m =>
      norm(m.title).includes(termo) || norm(m.artist).includes(termo)
    ).slice(0, 50);

    if(!res.length){
      box.innerHTML = '<div style="text-align:center;padding:30px;opacity:.5">😕 Nada</div>';
      return;
    }

    box.innerHTML = '';
    res.forEach(m => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = '<div class="icon"><i class="fas fa-music"></i></div><div class="info"><span class="titulo">' + m.title + '</span><span class="artista">🎤 ' + m.artist + '</span></div>';
      div.onclick = () => {
        state.musicas = [m, ...todas.filter(x => x.title !== m.title)];
        state.fila = [m];
        state.historico = [];
        state.atual = null;
        state.modoAtual = m.genero;
        tocar();
        $('modalBusca').classList.remove('on');
      };
      box.appendChild(div);
    });
  }
}

/* ============================================================
   ❤️ FAVORITAS
   ============================================================ */
function initFavoritas(){
  $('btnFavoritas').onclick = () => {
    $('modalFavoritas').classList.add('on');
    renderFavoritas();
  };
  $('fecharFav').onclick = () => $('modalFavoritas').classList.remove('on');
}

function renderFavoritas(){
  const box = $('listaFav');
  if(!state.favs.length){
    box.innerHTML = '<div style="text-align:center;padding:30px;opacity:.5">💔 Nenhuma ainda</div>';
    return;
  }
  box.innerHTML = '';
  state.favs.forEach(m => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<div class="info"><span class="titulo">' + m.title + '</span><span class="artista">' + m.artist + '</span></div><button class="rem"><i class="fas fa-times-circle"></i></button>';
    div.querySelector('.info').onclick = () => {
      state.musicas = state.favs.map(x => ({...x}));
      state.fila = [m];
      state.historico = [];
      state.atual = null;
      tocar();
      $('modalFavoritas').classList.remove('on');
    };
    div.querySelector('.rem').onclick = (e) => {
      e.stopPropagation();
      state.favs = state.favs.filter(x => x.title !== m.title);
      localStorage.setItem('vdb_favs', JSON.stringify(state.favs));
      atualizarBadgeFav();
      renderFavoritas();
    };
    box.appendChild(div);
  });
}

function atualizarBadgeFav(){
  const b = $('badgeFav');
  b.textContent = state.favs.length;
  b.style.display = state.favs.length > 0 ? 'block' : 'none';
}

/* ============================================================
   🎸 GÊNEROS
   ============================================================ */
function initGeneros(){
  $('btnGeneros').onclick = () => {
    $('modalGeneros').classList.add('on');
    renderGeneros();
  };
  $('fecharGen').onclick = () => $('modalGeneros').classList.remove('on');
}

function renderGeneros(){
  const box = $('listaGeneros');
  box.innerHTML = '';
  ORDEM.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'gen';
    btn.textContent = g;
    btn.onclick = () => selecionarGenero(g);
    box.appendChild(btn);
  });
}

async function selecionarGenero(g){
  toast('⏳ Carregando ' + g);
  $('modalGeneros').classList.remove('on');
  const ms = await buscarGenero(g);
  if(!ms || !ms.length){ toast('❌ Erro ao carregar'); return; }
  state.musicas = ms;
  state.modoAtual = g;
  state.fila = shuffle(ms);
  state.historico = [];
  state.atual = null;
  toast('🎵 ' + g + ' (' + ms.length + ')');
  tocar();
}

/* ============================================================
   ☰ MENU
   ============================================================ */
function initMenu(){
  $('btnMenu').onclick = () => $('menu').classList.toggle('on');

  $('mTema').onclick = () => {
    $('menu').classList.remove('on');
    const temas = {azul:['#2563eb','#3b82f6'],roxo:['#7c3aed','#a855f7'],verde:['#10b981','#34d399'],rosa:['#ec4899','#f472b6']};
    const keys = Object.keys(temas);
    const atual = localStorage.getItem('vdb_tema') || 'azul';
    const prox = keys[(keys.indexOf(atual)+1) % keys.length];

    document.documentElement.style.setProperty('--cor-2', t[1]);

    toast('🎨 ' + prox);
  };

  $('mFull').onclick = () => {
    $('menu').classList.remove('on');
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.().catch(()=>{});
    } else {
      document.exitFullscreen?.();
    }
  };

  $('mSleep').onclick = async () => {
    $('menu').classList.remove('on');
    const min = prompt('Desligar em quantos minutos?');
    if(min && parseInt(min) > 0){
      setTimeout(() => { audio.pause(); $('play').innerHTML='<i class="fas fa-play"></i>'; }, parseInt(min)*60000);
      toast('⏰ Sleep: ' + min + 'min');

  $('mRecarregar').onclick = () => location.reload();

  $('mId').onclick = () => {

  };

  $('mShare').onclick = () => {
    $('menu').classList.remove('on');

}

function initBloqueio(){
  $('liberar').onclick = liberar;
  $('inputLicenca').onkeydown = e => { if(e.key === 'Enter') liberar(); };

/* ============================================================
   🎵 PLAYER INIT
   ============================================================ */
function initPlayer(){
  $('play').onclick = togglePlay;
  $('next').onclick = next;
  $('prev').onclick = prev;

  audio.ontimeupdate = () => {
    if(audio.duration && isFinite(audio.duration)){
      const pct = (audio.currentTime/audio.duration)*100;
      $('barraFill').style.width = pct + '%';
      $('tempoAtual').textContent = fmt(audio.currentTime);
      $('tempoTotal').textContent = fmt(audio.duration);
    }
  };

  $('barra').onclick = e => {
    if(!audio.duration) return;
    const r = $('barra').getBoundingClientRect();
    const pct = (e.clientX - r.left) / r.width;
    audio.currentTime = pct * audio.duration;
  };

  audio.onended = () => next();
  audio.onerror = () => setTimeout(next, 500);
}

/* ============================================================
   🚀 INICIAR
   ============================================================ */
async function iniciar(){
  try{
    $('loadingVer').textContent = VERSAO;
    state.fingerprint = await fp();

    const acesso = await verificarAcesso();
    if(!acesso.ok){
      $('meuId').textContent = state.fingerprint;
      $('bloqueio').classList.add('on');
    }

    // Carrega tema salvo
    const temaSalvo = localStorage.getItem('vdb_tema');
    if(temaSalvo){
      const temas = {azul:['#2563eb','#3b82f6'],roxo:['#7c3aed','#a855f7'],verde:['#10b981','#34d399'],rosa:['#ec4899','#f472b6']};
      if(temas[temaSalvo]){
        document.documentElement.style.setProperty('--cor-1', temas[temaSalvo][0]);
        document.documentElement.style.setProperty('--cor-2', temas[temaSalvo][1]);
      }
    }

    // Setup
    initPlayer();
    initBusca();
    initFavoritas();
    initGeneros();
    initMenu();
    initYT();
    initBloqueio();
    setupAdmin();
    atualizarBadgeFav();

    // Carregar BÔNUS
    const m = await buscarGenero('BÔNUS');
    if(m && m.length){
      state.musicas = m;
      state.fila = shuffle(m);
    }

    await iniciarTimer();

    // Mostrar app
    $('loading').classList.add('hide');
    $('app').classList.add('on');
    setTimeout(() => $('loading').style.display = 'none', 700);
  }catch(e){
    console.error('Erro:', e);
    $('loading').classList.add('hide');
    $('app').classList.add('on');
    setTimeout(() => $('loading').style.display = 'none', 700);
  }
}

iniciar();
})();
